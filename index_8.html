/* Agrega/quita un slot de jugador de la lista actual. Se usan tanto desde
   la tarjeta "+ Agregar jugador" como desde los botones rápidos +/- del
   encabezado, para cubrir el caso de eventos donde no se completan todos
   los roles hasta el máximo establecido. */
function addPlayerSlot() {
  const max = state.mode === 'zvz' ? 20 : MODES[state.mode].max;
  const r = currentRoster();
  if (r.length >= max) { showToast(`Ya alcanzaste el máximo de ${max} jugadores`); return; }
  r.push({ id: uid(), role: 'dps_melee', weaponIdx: 0, player: '', gear: {} });
  setCurrentRoster(r);
  renderPanel();
}
function removeLastPlayerSlot() {
  const r = currentRoster();
  if (!r.length) { showToast('No hay jugadores para quitar'); return; }
  r.pop();
  setCurrentRoster(r);
  renderPanel();
}

/* ---------------- Render: panel principal ---------------- */
function renderPanel() {
  saveToStorage();
  const panel = document.getElementById('panel');
  panel.innerHTML = '';

  if (state.mode === 'balance') {
    panel.appendChild(buildBalancePanel());
    return;
  }

  if (SOLO_MODES.includes(state.mode)) {
    panel.appendChild(buildSoloPanel());
    return;
  }

  panel.appendChild(buildSummaryStrip());

  if (state.mode === 'zvz') panel.appendChild(buildZvzVariantBar());
  panel.appendChild(buildCompTabBar());

  const roster = currentRoster();
  const max = state.mode === 'zvz' ? 20 : MODES[state.mode].max;

  const head = document.createElement('div');
  head.className = 'roster-head';
  const activeEntry = currentCompEntry();
  const title = state.mode === 'zvz'
    ? `${activeEntry.name} · ${ZVZ_VARIANTS[state.zvzVariant].label}`
    : `${MODES[state.mode].label} — ${activeEntry.name}`;
  head.innerHTML = `
    <h2>${title}</h2>
    <div class="fill-bar-wrap"><div class="fill-bar" style="width:${Math.min(100, roster.length / max * 100)}%"></div></div>
    <div style="font-size:13px;color:var(--grey);">${roster.length} / ${max} jugadores</div>
  `;
  const quickControls = document.createElement('div');
  quickControls.className = 'quick-controls';
  quickControls.innerHTML = `
    <button type="button" class="small ghost" id="quickRemove" title="Quitar el último jugador de la lista">− Quitar</button>
    <button type="button" class="small ghost" id="quickAdd" title="Agregar un jugador extra a la lista">+ Agregar</button>
  `;
  head.appendChild(quickControls);
  panel.appendChild(head);
  head.querySelector('#quickAdd').onclick = addPlayerSlot;
  head.querySelector('#quickRemove').onclick = removeLastPlayerSlot;

  const grid = document.createElement('div');
  grid.className = 'grid';
  roster.forEach((slot, idx) => grid.appendChild(buildSlotCard(slot, idx)));

  if (roster.length < max) {
    const addCard = document.createElement('button');
    addCard.className = 'add-slot-card';
    addCard.innerHTML = '+ Agregar jugador';
    addCard.onclick = addPlayerSlot;
    grid.appendChild(addCard);
  }
  panel.appendChild(grid);

  panel.appendChild(buildLegend());
}

function buildSummaryStrip() {
  const wrap = document.createElement('div');
  wrap.className = 'summary-strip';

  let roster, totalGroups = null;
  if (state.mode === 'zvz') {
    roster = state.comps.zvz.list.flatMap(e => e.roster);
    totalGroups = state.comps.zvz.list.length;
  } else {
    roster = currentRoster();
  }

  const counts = {};
  roster.forEach(s => counts[s.role] = (counts[s.role] || 0) + 1);
  const filled = roster.filter(s => s.player.trim()).length;

  const stats = [];
  if (totalGroups !== null) {
    stats.push([`Grupos ZVZ`, totalGroups]);
    stats.push([`Jugadores totales`, roster.length]);
  } else {
    stats.push([`Jugadores`, roster.length]);
  }
  stats.push([`Nombres asignados`, `${filled}/${roster.length}`]);
  for (const key of ROLE_KEYS) {
    if (counts[key]) stats.push([ROLES[key].label, counts[key]]);
  }

  stats.forEach(([label, val]) => {
    const s = document.createElement('div');
    s.className = 'stat';
    s.innerHTML = `<b>${val}</b>${label}`;
    wrap.appendChild(s);
  });
  return wrap;
}

/* Barra de builds guardadas — genérica para las 5 modalidades de composición
   (ZVZ/Grupales/Estática/Avalón Azul/Avalón Dorado). Cada pestaña es una
   build con nombre propio (editable con ✎), que se puede crear, cambiar y
   eliminar sin perder las demás. Para ZVZ se mantiene el tope histórico de
   4 grupos por evento; el resto no tiene límite. */
function buildCompTabBar() {
  const wrap = document.createElement('div');
  wrap.className = 'group-bar';
  const mode = state.mode;
  const bucket = state.comps[mode];
  const max = mode === 'zvz' ? 20 : MODES[mode].max;

  bucket.list.forEach((entry, i) => {
    const tab = document.createElement('div');
    tab.className = 'group-tab' + (bucket.active === i ? ' active' : '');
    tab.title = 'Tocá para ver esta build — ✎ para renombrarla';

    const nameEl = document.createElement('span');
    nameEl.textContent = entry.name;
    tab.appendChild(nameEl);

    const countEl = document.createElement('span');
    countEl.className = 'count';
    countEl.textContent = `${entry.roster.length}/${max}`;
    tab.appendChild(countEl);

    const renameBtn = document.createElement('button');
    renameBtn.type = 'button';
    renameBtn.className = 'tab-rename-btn';
    renameBtn.textContent = '✎';
    renameBtn.title = 'Renombrar esta build';
    renameBtn.onclick = (e) => {
      e.stopPropagation();
      const nn = prompt('Nombre para esta build:', entry.name);
      if (nn === null) return;
      const clean = nn.trim();
      if (clean) { entry.name = clean; renderPanel(); }
    };
    tab.appendChild(renameBtn);

    tab.onclick = () => { if (bucket.active !== i) { bucket.active = i; renderPanel(); } };
    wrap.appendChild(tab);
  });

  if (mode !== 'zvz' || bucket.list.length < 4) {
    const addBtn = document.createElement('button');
    addBtn.className = 'small ghost';
    addBtn.textContent = '+ Nueva build';
    addBtn.onclick = () => {
      const suggested = defaultCompName(mode);
      const nn = prompt('Nombre para la nueva build:', suggested);
      if (nn === null) return;
      bucket.list.push(newCompEntry(mode, nn.trim() || suggested));
      bucket.active = bucket.list.length - 1;
      renderPanel();
    };
    wrap.appendChild(addBtn);
  }
  if (bucket.list.length > 1) {
    const delBtn = document.createElement('button');
    delBtn.className = 'small ghost';
    delBtn.textContent = '🗑 Eliminar build actual';
    delBtn.onclick = () => {
      if (!confirm(`¿Eliminar la build "${bucket.list[bucket.active].name}"? Esta acción no se puede deshacer.`)) return;
      bucket.list.splice(bucket.active, 1);
      bucket.active = Math.max(0, bucket.active - 1);
      renderPanel();
    };
    wrap.appendChild(delBtn);
  }
  return wrap;
}

/* Colores de acento por rol — un tono claramente distinto por rol (ninguno se
   repite) para que cada tarjeta se identifique de un vistazo, manteniendo
   luminosidad media para que se lea bien tanto en tema oscuro como claro. */
const ROLE_ACCENT = {
  caller: '#d4a017',        // dorado — líder / IC
  tanque: '#3d7dca',        // azul acero — primera línea / escudo
  sanador: '#2e9e5b',       // verde esmeralda — sanación
  soporte: '#9b59b6',       // violeta — utilidad / CC
  dps_distancia: '#1fada0', // turquesa — daño a distancia
  dps_mago: '#c9327a',      // magenta — magia
  dps_melee: '#c81e3a',     // rojo carmesí — cuerpo a cuerpo
};

/* Recorta el nombre de un ítem a su forma en español para mostrar debajo del
   ícono: quita anotaciones en inglés entre paréntesis y etiquetas de tier
   (ej. '⭐S-Tier') que se agregan como referencia meta, pero conserva el
   nombre completo (con el inglés) en el atributo title/tooltip y en los
   selects, donde sí es útil para buscar builds de guías en inglés. */
function shortEsName(name) {
  if (!name) return name;
  return name.split(' (')[0].split('⭐')[0].trim();
}

/* Una "casilla" del muñeco de equipo (paperdoll): ícono grande + etiqueta de
   tipo de slot + nombre del ítem en español debajo, imitando cómo Albion
   muestra el equipo puesto sobre el personaje. `piece` es [nombre, sufijo]
   o null si no aplica. Si se pasa `editable`, la casilla se puede clickear
   para cambiar esa pieza puntual del jugador (independiente de la build). */
function dollSlot(piece, fallbackEmoji, tag, extraClass, editable) {
  const el = document.createElement('div');
  el.className = 'doll-slot ' + extraClass + (piece ? ' filled' : ' empty') + (editable ? ' editable' : '');

  const iconBox = document.createElement('div');
  iconBox.className = 'doll-icon-box';
  iconBox.innerHTML = `<span class="fallback">${fallbackEmoji}</span>`;

  const label = document.createElement('div');
  label.className = 'doll-label';
  const tagEl = document.createElement('span');
  tagEl.className = 'doll-tag';
  tagEl.textContent = tag;
  const nameEl = document.createElement('span');
  nameEl.className = 'doll-name';
  nameEl.textContent = piece ? shortEsName(piece[0]) : '—';
  label.appendChild(tagEl);
  label.appendChild(nameEl);

  if (piece) {
    const [name, suffix] = piece;
    el.title = name;
    nameEl.title = name;
    const url = iconUrl(suffix);
    if (url) {
      const img = document.createElement('img');
      img.src = url;
      img.alt = name;
      img.onerror = () => { iconBox.innerHTML = `<span class="fallback">${fallbackEmoji}</span>`; };
      iconBox.innerHTML = '';
      iconBox.appendChild(img);
    }
  }
  if (editable) {
    const hint = document.createElement('span');
    hint.className = 'doll-edit-hint';
    hint.textContent = '✎';
    iconBox.appendChild(hint);
    el.title = (el.title ? el.title + ' — ' : '') + 'Click para cambiar';
    el.onclick = () => openGearPicker(editable.pieceLabel, editable.catalog, editable.currentKey, editable.allowNone, editable.onPick, editable.showReset !== false);
  }
  el.appendChild(iconBox);
  el.appendChild(label);
  return el;
}

/* Construye el muñeco de equipo completo (6 casillas en cruz, como la
   pantalla de personaje de Albion): arma arriba-izq/centro, casco arriba,
   capa arriba-der, off-hand der, pecho centro, botas abajo. Casco, capa,
   pecho, botas y off-hand se pueden editar pieza por pieza haciendo click
   sobre la casilla, sin importar la build elegida. */
function buildDoll(weapon, def, slot, weaponEditable) {
  if (weaponEditable === undefined) weaponEditable = true;
  const doll = document.createElement('div');
  doll.className = 'paperdoll';

  // Catálogo de armas para editar el arma principal tocando la casilla —
  // en tarjetas de roster se ofrece el catálogo COMPLETO de todas las armas
  // de la herramienta (agrupadas por familia), igual que en Solitario, así
  // cualquier jugador puede llevar el arma que quiera y no solo las
  // predeterminadas del rol (mismo criterio que el <select> de abajo). La
  // elección se guarda en `slot.customWeapon` (objeto de arma completo, o
  // null para volver al arma por defecto de la build/plantilla, que sigue
  // viviendo en `slot.weaponIdx` sin tocarse). En tarjetas de Solitario se
  // pasa directamente un objeto de configuración ya armado (weaponEditable
  // como objeto en vez de true/false — ver buildSoloCard).
  let weaponEditableCfg;
  if (weaponEditable && typeof weaponEditable === 'object') {
    weaponEditableCfg = weaponEditable;
  } else if (weaponEditable && ROLES[slot.role]) {
    weaponEditableCfg = {
      pieceLabel: 'arma', catalog: WEAPON_PICKER_GROUPS, currentKey: weapon.name, allowNone: false, showReset: true,
      onPick: (key) => {
        if (key === null) {
          slot.customWeapon = null;
        } else {
          const found = MASTER_WEAPONS.find(w => w.name === key);
          if (found) slot.customWeapon = found;
        }
        slot.gear = {};
        renderPanel();
      },
    };
  }
  const weaponSlot = dollSlot(weapon.u ? [weapon.name, weapon.u] : null, def.icon, 'Arma', 'weapon-slot', weaponEditableCfg);
  if (!weapon.u) {
    weaponSlot.classList.remove('empty'); weaponSlot.classList.add('filled');
    weaponSlot.title = weapon.name + ' — Click para cambiar';
    const nm = weaponSlot.querySelector('.doll-name');
    if (nm) { nm.textContent = shortEsName(weapon.name); nm.title = weapon.name; }
  }
  const tierBadge = document.createElement('span');
  tierBadge.className = 'tier-badge';
  tierBadge.textContent = TIER;
  weaponSlot.querySelector('.doll-icon-box').appendChild(tierBadge);
  doll.appendChild(weaponSlot);

  const onPickFor = (type) => (key) => {
    slot.gear = slot.gear || {};
    if (key === null) delete slot.gear[type];
    else slot.gear[type] = key;
    renderPanel();
  };

  const helmPiece = effectivePiece(slot, weapon, 'helm');
  const capePiece = effectivePiece(slot, weapon, 'cape');
  const chestPiece = effectivePiece(slot, weapon, 'chest');
  const offPiece = effectivePiece(slot, weapon, 'off');
  const bootsPiece = effectivePiece(slot, weapon, 'boots');
  const foodPiece = effectivePiece(slot, weapon, 'food');

  doll.appendChild(dollSlot(foodPiece, foodPiece ? '🍖' : '—', 'Comida', 'food-slot' + (foodPiece ? '' : ' na'), {
    pieceLabel: 'comida', catalog: FOOD, currentKey: slot.gear && slot.gear.food, allowNone: true, onPick: onPickFor('food'),
  }));
  doll.appendChild(dollSlot(helmPiece, '🪖', 'Casco', 'helm-slot', {
    pieceLabel: 'casco', catalog: HELM_GROUPED, currentKey: slot.gear && slot.gear.helm, allowNone: false, onPick: onPickFor('helm'),
  }));
  doll.appendChild(dollSlot(capePiece, '🧣', 'Capa', 'cape-slot', {
    pieceLabel: 'capa', catalog: CAPE, currentKey: slot.gear && slot.gear.cape, allowNone: false, onPick: onPickFor('cape'),
  }));
  doll.appendChild(dollSlot(chestPiece, '👕', 'Pecho', 'chest-slot', {
    pieceLabel: 'pieza de pecho', catalog: CHEST_GROUPED, currentKey: slot.gear && slot.gear.chest, allowNone: false, onPick: onPickFor('chest'),
  }));
  doll.appendChild(dollSlot(offPiece, offPiece ? '📯' : '—', 'Off-hand', 'off-slot' + (offPiece ? '' : ' na'), {
    pieceLabel: 'off-hand', catalog: OFF_GROUPED, currentKey: slot.gear && slot.gear.off, allowNone: true, onPick: onPickFor('off'),
  }));
  doll.appendChild(dollSlot(bootsPiece, '👢', 'Botas', 'boots-slot', {
    pieceLabel: 'botas', catalog: BOOTS_GROUPED, currentKey: slot.gear && slot.gear.boots, allowNone: false, onPick: onPickFor('boots'),
  }));
  return doll;
}

function buildSlotCard(slot, idx) {
  const def = ROLES[slot.role];
  const weapon = slot.customWeapon || def.weapons[slot.weaponIdx] || def.weapons[0];
  const accent = ROLE_ACCENT[slot.role] || 'var(--red)';

  const card = document.createElement('div');
  card.className = 'slot-card';
  card.style.setProperty('--accent', accent);
  card.dataset.roleIcon = def.icon;

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-slot';
  removeBtn.textContent = '✕';
  removeBtn.title = 'Quitar jugador';
  removeBtn.onclick = () => {
    const r = currentRoster();
    r.splice(idx, 1);
    setCurrentRoster(r);
    renderPanel();
  };
  card.appendChild(removeBtn);

  // Cinta de rol: identifica el rol de un vistazo y aporta el color distintivo
  const roleBadge = document.createElement('div');
  roleBadge.className = 'role-badge';
  roleBadge.innerHTML = `<span>${def.icon}</span><span>${def.label}</span>`;
  card.appendChild(roleBadge);

  // Muñeco de equipo — look "personaje equipado" con las 6 piezas
  card.appendChild(buildDoll(weapon, def, slot));

  const selects = document.createElement('div');
  selects.className = 'selects';

  const roleSelect = document.createElement('select');
  roleSelect.className = 'role-select';
  ROLE_KEYS.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = `${ROLES[k].icon} ${ROLES[k].label}`;
    if (k === slot.role) opt.selected = true;
    roleSelect.appendChild(opt);
  });
  roleSelect.onchange = () => {
    slot.role = roleSelect.value;
    slot.weaponIdx = 0;
    slot.customWeapon = null;
    slot.gear = {};
    renderPanel();
  };
  selects.appendChild(roleSelect);

  // Selector de arma — catálogo COMPLETO (todas las armas del juego,
  // agrupadas por familia con <optgroup>), no solo las del rol, para poder
  // armar cualquier build sin restricciones. La opción de arriba de todo
  // vuelve al arma por defecto de la plantilla (equivalente a "Usar la de
  // la build" del selector visual en el muñeco).
  const weaponSelect = document.createElement('select');
  weaponSelect.className = 'weapon-select';
  const defaultWeapon = def.weapons[slot.weaponIdx] || def.weapons[0];
  const defaultOpt = document.createElement('option');
  defaultOpt.value = '';
  defaultOpt.textContent = `↺ Por defecto (${shortEsName(defaultWeapon.name)})`;
  weaponSelect.appendChild(defaultOpt);
  WEAPON_PICKER_GROUPS.forEach(group => {
    const optgroup = document.createElement('optgroup');
    optgroup.label = group.label;
    Object.keys(group.entries).forEach(key => {
      const [name] = group.entries[key];
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = name;
      optgroup.appendChild(opt);
    });
    weaponSelect.appendChild(optgroup);
  });
  weaponSelect.value = slot.customWeapon ? weapon.name : '';
  weaponSelect.onchange = () => {
    const key = weaponSelect.value;
    if (!key) {
      slot.customWeapon = null;
    } else {
      const found = MASTER_WEAPONS.find(w => w.name === key);
      if (found) slot.customWeapon = found;
    }
    slot.gear = {};
    renderPanel();
  };
  selects.appendChild(weaponSelect);

  card.appendChild(selects);

  const playerInput = document.createElement('input');
  playerInput.className = 'player-input';
  playerInput.placeholder = 'Nombre del jugador...';
  playerInput.value = slot.player;
  playerInput.oninput = () => { slot.player = playerInput.value; };
  playerInput.addEventListener('blur', () => renderPanel());
  card.appendChild(playerInput);

  return card;
}

function buildLegend() {
  const wrap = document.createElement('div');
  wrap.className = 'legend';
  ROLE_KEYS.forEach(k => {
    const def = ROLES[k];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.title = def.desc;
    item.innerHTML = `<span>${def.icon}</span> <b style="color:var(--white)">${def.label}:</b> ${def.desc}`;
    wrap.appendChild(item);
  });
  return wrap;
}

/* ---------------- Render: pestaña Solitario (PvE / PvP) ---------------- */
/* La tarjeta de Solitario es un punto de partida totalmente editable, no
   una referencia fija: además de las piezas de armadura, acá también se
   puede cambiar el arma principal — eligiendo entre TODAS las armas de la
   herramienta (agrupadas por familia), no solo las del rol. El override
   guarda tanto las piezas (igual que slot.gear en el roster) como el arma
   elegida (null = usar la de la build sugerida). */
function soloOverrideFor(b) {
  let ov = state.soloOverrides[b.id];
  if (!ov || typeof ov.gear !== 'object') ov = { gear: {}, weapon: null };
  state.soloOverrides[b.id] = ov;
  return ov;
}

function buildSoloStatsChart(stats, accent) {
  const wrap = document.createElement('div');
  wrap.className = 'solo-stats';
  Object.keys(SOLO_STATS_LABELS).forEach(key => {
    const val = Math.max(0, Math.min(10, stats[key] || 0));
    const row = document.createElement('div');
    row.className = 'solo-stat-row';
    row.innerHTML = `
      <span class="solo-stat-label">${SOLO_STATS_LABELS[key]}</span>
      <span class="solo-stat-track"><span class="solo-stat-fill" style="width:${val * 10}%;background:linear-gradient(90deg, color-mix(in srgb, ${accent} 55%, transparent), ${accent})"></span></span>
      <span class="solo-stat-value">${val}/10</span>
    `;
    wrap.appendChild(row);
  });
  return wrap;
}

function buildSoloCard(b, accent) {
  const card = document.createElement('div');
  card.className = 'solo-card';
  card.style.setProperty('--accent', accent);

  const head = document.createElement('div');
  head.className = 'solo-card-head';
  head.innerHTML = `<div class="solo-card-title"><span>${b.icon}</span><span>${b.label}</span></div>`;
  card.appendChild(head);

  const ov = soloOverrideFor(b);
  const weapon = ov.weapon || b.weapon;
  const slot = { gear: ov.gear };

  const weaponEditableCfg = {
    pieceLabel: 'arma', catalog: WEAPON_PICKER_GROUPS, currentKey: weapon.name, allowNone: false, showReset: true,
    onPick: (key) => {
      if (key === null) {
        ov.weapon = null;
      } else {
        const found = MASTER_WEAPONS.find(w => w.name === key);
        if (found) ov.weapon = found;
      }
      ov.gear = {};
      renderPanel();
    },
  };
  card.appendChild(buildDoll(weapon, { icon: b.icon }, slot, weaponEditableCfg));

  const desc = document.createElement('p');
  desc.className = 'solo-desc';
  desc.textContent = b.desc;
  card.appendChild(desc);

  card.appendChild(buildSoloStatsChart(computeSoloStats(weapon, slot), accent));

  return card;
}

function buildSoloPanel() {
  const wrap = document.createElement('div');
  wrap.className = 'solo-panel';

  const note = document.createElement('div');
  note.className = 'solo-note';
  note.innerHTML = `⚠ Punto de partida de meta ago-2026 (temporada Radiant Wilds) — no son datos oficiales de Albion Online. Tocá el arma o cualquier pieza para elegir entre TODO el catálogo de la herramienta (agrupado por familia/material): el gráfico de abajo se recalcula según lo que dejes puesto.`;
  wrap.appendChild(note);

  const grid = document.createElement('div');
  grid.className = 'solo-grid';
  const accent = SOLO_ACCENT[state.mode] || 'var(--red)';
  SOLO_BUILDS[state.mode].forEach(b => grid.appendChild(buildSoloCard(b, accent)));
  wrap.appendChild(grid);

  return wrap;
}

/* ---------------- Render: pestaña de Balance ---------------- */
/* Paleta para los avatares de jugador — un color consistente por nombre
   (mismo criterio de tono medio que ROLE_ACCENT) para darle más identidad
   visual a cada fila del balance. */
const AVATAR_PALETTE = ['#d4a017', '#3d7dca', '#2e9e5b', '#9b59b6', '#1fada0', '#c9327a', '#c81e3a'];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function avatarHtml(name, extraClass) {
  return `<span class="balance-avatar${extraClass ? ' ' + extraClass : ''}" style="background:${avatarColor(name)}">${name.charAt(0).toUpperCase()}</span>`;
}

function buildBalancePanel() {
  const wrap = document.createElement('div');
  wrap.className = 'balance-panel';

  const totalBal = state.balances.reduce((s, p) => s + p.balance, 0);
  const positiveCount = state.balances.filter(p => p.balance > 0).length;

  const head = document.createElement('div');
  head.className = 'roster-head';
  head.innerHTML = `<h2>💰 Balance del gremio</h2>`;
  wrap.appendChild(head);

  const stats = document.createElement('div');
  stats.className = 'summary-strip';
  stats.innerHTML = `
    <div class="stat"><b>${state.balances.length}</b>Jugadores registrados</div>
    <div class="stat balance-stat-total"><b>${fmtMoney(totalBal)}</b>Saldo total del gremio</div>
    <div class="stat"><b>${positiveCount}</b>Con saldo a favor</div>
  `;
  wrap.appendChild(stats);

  const addRow = document.createElement('div');
  addRow.className = 'balance-toolbar';
  addRow.innerHTML = `
    <input type="text" id="balNewName" class="player-input" placeholder="Nombre del jugador nuevo...">
    <button type="button" class="ghost" id="balAddPlayerBtn">+ Agregar jugador al balance</button>
  `;
  wrap.appendChild(addRow);
  const nameInput = addRow.querySelector('#balNewName');
  const doAddPlayer = () => {
    const p = addBalancePlayer(nameInput.value);
    if (p) { renderPanel(); showToast(`${p.name} agregado al balance ✔`); }
    else showToast('Escribí un nombre válido');
  };
  addRow.querySelector('#balAddPlayerBtn').onclick = doAddPlayer;
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAddPlayer(); });

  if (!state.balances.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Todavía no agregaste jugadores al balance. Sumá el primero arriba para empezar a registrar saldo.';
    wrap.appendChild(empty);
    return wrap;
  }

  const moveCard = document.createElement('div');
  moveCard.className = 'balance-move-card';
  const playerOptions = state.balances.map(p => `<option value="${p.id}">${p.name} (${fmtMoney(p.balance)})</option>`).join('');
  moveCard.innerHTML = `
    <div class="balance-move-title">💸 Registrar movimiento</div>
    <div class="balance-move-form">
      <select id="balMovePlayer">${playerOptions}</select>
      <input type="number" id="balMoveAmount" placeholder="Monto" min="0" step="1">
      <input type="text" id="balMoveNote" placeholder="Nota (opcional) — ej. loot ZVZ 18/08">
      <button type="button" class="primary small" id="balAddBtn">+ Agregar saldo</button>
      <button type="button" class="ghost small" id="balSubBtn">− Quitar saldo</button>
    </div>
  `;
  wrap.appendChild(moveCard);

  function doMove(sign) {
    const playerId = moveCard.querySelector('#balMovePlayer').value;
    const amount = Math.abs(Number(moveCard.querySelector('#balMoveAmount').value));
    const note = moveCard.querySelector('#balMoveNote').value;
    if (!amount) { showToast('Ingresá un monto válido'); return; }
    addBalanceMovement(playerId, amount * sign, note);
    renderPanel();
    showToast(sign > 0 ? 'Saldo agregado ✔' : 'Saldo descontado ✔');
  }
  moveCard.querySelector('#balAddBtn').onclick = () => doMove(1);
  moveCard.querySelector('#balSubBtn').onclick = () => doMove(-1);

  const table = document.createElement('div');
  table.className = 'balance-table';
  const tHead = document.createElement('div');
  tHead.className = 'balance-row balance-row-head';
  tHead.innerHTML = `<div>Jugador</div><div>Saldo</div><div>Movs.</div><div></div>`;
  table.appendChild(tHead);

  [...state.balances].sort((a, b) => b.balance - a.balance).forEach(p => {
    const row = document.createElement('div');
    row.className = 'balance-row';
    const cls = p.balance > 0 ? 'positive' : (p.balance < 0 ? 'negative' : '');
    row.innerHTML = `
      <div class="balance-name-cell">${avatarHtml(p.name)}<span class="balance-name">${p.name}</span></div>
      <div class="balance-amount ${cls}">${fmtMoney(p.balance)}</div>
      <div class="balance-count">${p.history.length} mov.</div>
      <div class="balance-actions">
        <button type="button" class="small ghost balHistBtn">Historial</button>
        <button type="button" class="small ghost balDelBtn" title="Quitar jugador del balance">✕</button>
      </div>
    `;
    row.querySelector('.balHistBtn').onclick = () => {
      const hCls = p.balance > 0 ? 'positive' : (p.balance < 0 ? 'negative' : '');
      let itemsHtml;
      if (!p.history.length) {
        itemsHtml = `<div class="empty-msg">Todavía no hay movimientos registrados para ${p.name}.</div>`;
      } else {
        itemsHtml = p.history.map(h => {
          const d = new Date(h.ts);
          const fecha = d.toLocaleDateString('es-ES') + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          const iCls = h.delta > 0 ? 'positive' : 'negative';
          const sign = h.delta > 0 ? '+' : '';
          return `
            <div class="bal-hist-item ${iCls}">
              <div class="bal-hist-item-amount">${sign}${fmtMoney(h.delta)}</div>
              <div class="bal-hist-item-meta">
                <span class="bal-hist-date">${fecha}</span>
                ${h.note ? `<span class="bal-hist-note">${h.note}</span>` : ''}
              </div>
            </div>`;
        }).join('');
      }
      const html = `
        <div class="bal-hist-summary">
          ${avatarHtml(p.name, 'large')}
          <div>
            <div class="bal-hist-summary-name">${p.name}</div>
            <div class="bal-hist-summary-amount ${hCls}">${fmtMoney(p.balance)}</div>
          </div>
        </div>
        <div class="bal-hist-list">${itemsHtml}</div>
      `;
      openGuideModal('Historial de movimientos', html);
    };
    row.querySelector('.balDelBtn').onclick = () => {
      if (!confirm(`¿Quitar a ${p.name} del balance? Se perderá su historial.`)) return;
      removeBalancePlayer(p.id);
      renderPanel();
    };
    table.appendChild(row);
  });
  wrap.appendChild(table);

  return wrap;
}

function renderAll() {
  renderModeBar();
  renderPanel();
}

/* ---------------- Exportar / Importar ---------------- */
function serializeState() {
  return JSON.stringify({
    version: 2,
    guildName: state.guildName,
    mode: state.mode,
    lastCompMode: state.lastCompMode,
    lastSoloMode: state.lastSoloMode,
    lastAvalonMode: state.lastAvalonMode,
    zvzVariant: state.zvzVariant,
    comps: state.comps,
    balances: state.balances,
    soloOverrides: state.soloOverrides,
  }, null, 2);
}

/* Aplica un objeto de estado (exportado con serializeState, o leído del
   localStorage del navegador) al estado actual — se usa tanto al importar un
   archivo .json a mano como al recuperar el autoguardado al abrir la
   página. Tolera datos viejos/incompletos (de una versión anterior de la
   herramienta) sin romper: todo lo que falte se queda con su valor actual. */
function applyState(data) {
  if (!data || typeof data !== 'object') return;
  state.guildName = data.guildName || state.guildName;
  state.mode = data.mode || state.mode;
  state.zvzVariant = data.zvzVariant || state.zvzVariant;
  if (data.comps && typeof data.comps === 'object') {
    COMPOSABLE_MODES.forEach(m => {
      const incoming = data.comps[m];
      if (incoming && Array.isArray(incoming.list) && incoming.list.length) {
        state.comps[m] = {
          active: Math.min(Math.max(0, incoming.active || 0), incoming.list.length - 1),
          list: incoming.list,
        };
      }
    });
  } else if (data.zvzGroups || data.grupal || data.estatica || data.avalon_azul || data.avalon_dorado) {
    // Respaldo de una versión anterior (sin builds con nombre) — se migra
    // cada roster suelto a una lista de 1 sola build llamada "Grupo N"/"1".
    if (Array.isArray(data.zvzGroups) && data.zvzGroups.length) {
      state.comps.zvz = {
        active: Math.min(Math.max(0, data.zvzActive || 0), data.zvzGroups.length - 1),
        list: data.zvzGroups.map((roster, i) => ({ id: uid(), name: `Grupo ${i + 1}`, roster })),
      };
    }
    ['grupal', 'estatica', 'avalon_azul', 'avalon_dorado'].forEach(m => {
      if (Array.isArray(data[m]) && data[m].length) {
        state.comps[m] = { active: 0, list: [{ id: uid(), name: `${MODES[m].label} 1`, roster: data[m] }] };
      }
    });
  }
  state.lastCompMode = COMP_MODES.includes(state.mode) ? state.mode : (data.lastCompMode || state.lastCompMode || 'zvz');
  state.lastSoloMode = SOLO_MODES.includes(state.mode) ? state.mode : (data.lastSoloMode || state.lastSoloMode || 'solo_pve');
  state.lastAvalonMode = AVALON_MODES.includes(state.mode) ? state.mode : (data.lastAvalonMode || state.lastAvalonMode || 'avalon_azul');
  state.balances = data.balances || state.balances;
  state.soloOverrides = data.soloOverrides || state.soloOverrides;
}

/* ---------------- Autoguardado en el navegador ----------------
   Como esta herramienta se piensa para subir a un servidor propio (sin
   backend), el único lugar donde "guardar" tiene sentido es el navegador de
   quien la usa: localStorage. Cada cambio se autoguarda ahí, así que al
   cerrar la pestaña y volver a abrirla (o recargar la página) todo sigue
   como estaba. Esto es local a ESE navegador/dispositivo — no es un backend
   compartido — por eso además queda el botón "Exportar" para bajar un
   respaldo en .json que se puede guardar aparte o pasarle a otra persona. */
const STORAGE_KEY = 'pvpx_albion_comp_state_v2';
function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, serializeState()); } catch (err) { /* localStorage no disponible (modo privado, cuota llena, etc.) — se sigue usando la app sin autoguardado */ }
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function textReport() {
  const lines = [];
  lines.push(`═══ ${state.guildName || 'PVPX'} — Composición Albion Online ═══`);
  lines.push('');
  function rosterBlock(title, roster, max) {
    lines.push(`### ${title} (${roster.length}/${max})`);
    roster.forEach((s, i) => {
      const def = ROLES[s.role];
      const w = s.customWeapon || def.weapons[s.weaponIdx] || def.weapons[0];
      const name = s.player.trim() || '— sin asignar —';
      const pieces = [
        effectivePiece(s, w, 'helm'),
        effectivePiece(s, w, 'chest'),
        effectivePiece(s, w, 'boots'),
        effectivePiece(s, w, 'cape'),
        effectivePiece(s, w, 'off'),
        effectivePiece(s, w, 'food'),
      ];
      const gear = pieces.filter(Boolean).map(p => p[0]).join(' / ');
      lines.push(`${i + 1}. ${def.icon} ${def.label} | ${w.name}${gear ? ' [' + gear + ']' : ''} | ${name}`);
    });
    lines.push('');
  }
  if (state.mode === 'zvz') {
    lines.push(`Doctrina ZVZ: ${ZVZ_VARIANTS[state.zvzVariant].label}`);
    lines.push('');
    state.comps.zvz.list.forEach(entry => rosterBlock(`ZVZ — ${entry.name}`, entry.roster, 20));
  } else if (COMPOSABLE_MODES.includes(state.mode)) {
    const bucket = state.comps[state.mode];
    const entry = bucket.list[bucket.active];
    rosterBlock(`${MODES[state.mode].label} — ${entry.name}`, entry.roster, MODES[state.mode].max);
  } else if (SOLO_MODES.includes(state.mode)) {
    lines.push(`### Builds en solitario — ${MODES[state.mode].label}`);
    lines.push('');
    SOLO_BUILDS[state.mode].forEach((b, i) => {
      const ov = soloOverrideFor(b);
      const weapon = ov.weapon || b.weapon;
      const slot = { gear: ov.gear };
      const pieces = [
        effectivePiece(slot, weapon, 'helm'),
        effectivePiece(slot, weapon, 'chest'),
        effectivePiece(slot, weapon, 'boots'),
        effectivePiece(slot, weapon, 'cape'),
        effectivePiece(slot, weapon, 'off'),
      ];
      const gear = pieces.filter(Boolean).map(p => p[0]).join(' / ');
      lines.push(`${i + 1}. ${b.icon} ${b.label} | ${weapon.name}${gear ? ' [' + gear + ']' : ''}`);
    });
    lines.push('');
  } else if (state.mode === 'balance') {
    const total = state.balances.reduce((s, p) => s + p.balance, 0);
    lines.push(`### Balance de jugadores (saldo total: ${fmtMoney(total)})`);
    [...state.balances].sort((a, b) => b.balance - a.balance).forEach((p, i) => {
      lines.push(`${i + 1}. ${p.name} — ${fmtMoney(p.balance)}`);
    });
    lines.push('');
  }
  return lines.join('\n');
}

/* ---------------- Invitación para Discord (imagen + texto) ----------------
   Genera una tarjeta de invitación con la build actual, lista para pegar en
   Discord y que la gente se anote: arriba el título del evento y la lista
   de equipo por rol en texto (arma / pecho / casco / botas), abajo un grid
   visual con los íconos reales de cada pieza (vía Render Service de Albion;
   si algún ícono no carga, se usa un emoji de respaldo — la imagen nunca se
   rompe por eso). Se puede copiar la imagen directo al portapapeles (para
   pegar con Ctrl+V en el chat de Discord), descargarla como PNG, o copiar
   solo el texto. */

/* Roster + metadatos de la build actualmente mostrada, sin importar la
   pestaña (ZVZ toma el grupo activo, no todos los grupos a la vez — cada
   grupo se anuncia por separado). Devuelve null en Solitario/Balance,
   donde no aplica una "build" para invitar gente. */
function currentInvitationRoster() {
  if (state.mode === 'zvz') {
    const bucket = state.comps.zvz;
    const entry = bucket.list[bucket.active];
    return entry ? { entry, roster: entry.roster, label: `ZVZ · ${ZVZ_VARIANTS[state.zvzVariant].label}` } : null;
  }
  if (COMPOSABLE_MODES.includes(state.mode)) {
    const bucket = state.comps[state.mode];
    const entry = bucket.list[bucket.active];
    return entry ? { entry, roster: entry.roster, label: MODES[state.mode].label } : null;
  }
  return null;
}

function invitationGearLine(slot) {
  const def = ROLES[slot.role];
  const w = slot.customWeapon || def.weapons[slot.weaponIdx] || def.weapons[0];
  const helm = effectivePiece(slot, w, 'helm');
  const chest = effectivePiece(slot, w, 'chest');
  const boots = effectivePiece(slot, w, 'boots');
  const cape = effectivePiece(slot, w, 'cape');
  const parts = [shortEsName(w.name), chest && chest[0], helm && helm[0], boots && boots[0]].filter(Boolean);
  return { def, weapon: w, helm, chest, boots, cape, text: parts.join(' / ') };
}

/* Convierte el valor de un <input type="datetime-local"> — interpretado
   como la hora LOCAL de quien arma la invitación, que es como el navegador
   entrega ese valor — a un texto legible en horario UTC, para que
   cualquiera del gremio pueda convertirlo a su propio huso sin ambigüedad
   ni depender de que todos estén en la misma zona horaria. */
function formatWhenUTC(datetimeLocalValue) {
  if (!datetimeLocalValue) return '';
  const d = new Date(datetimeLocalValue);
  if (isNaN(d.getTime())) return '';
  try {
    const fmt = new Intl.DateTimeFormat('es-AR', {
      weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC',
    });
    return `${fmt.format(d)} UTC`;
  } catch (err) {
    return `${d.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
  }
}

function invitationTextBlock(title, when, notes, roster) {
  const lines = [];
  lines.push(`📢 ${title}`);
  if (when) lines.push(`🗓️ ${when}`);
  lines.push('');
  lines.push('Composición requerida:');
  roster.forEach(s => {
    const g = invitationGearLine(s);
    lines.push(`- ${g.def.icon} ${g.def.label}: ${g.text}.`);
  });
  if (notes) { lines.push(''); lines.push(`📌 ${notes}`); }
  lines.push('');
  lines.push('✅ ¡Anotate respondiendo a este mensaje con tu rol y arma disponible!');
  return lines.join('\n');
}

/* ---------------- Sincronización en vivo con Discord (opcional) -----------
   Además de copiar/descargar la invitación a mano, se puede "publicar" el
   evento: esta página escribe los datos en Firebase Realtime Database: un
   bot de Discord aparte (carpeta discord-bot/ junto a este archivo) lo ve,
   publica el mensaje en el canal configurado y le agrega una reacción por
   cada rol de la composición. A partir de ahí, cada reacción que la gente
   agregue o saque en Discord el bot la refleja en Firebase, y esta página
   la muestra en vivo acá abajo, sin recargar.

   Para que esto funcione hace falta:
   1. Completar FIREBASE_CONFIG de acá abajo con los datos de tu propio
      proyecto de Firebase (el plan gratis alcanza de sobra).
   2. Tener el bot de discord-bot/ corriendo (ver su README.md).
   Si no se completa FIREBASE_CONFIG, esta parte de la invitación
   simplemente no se muestra y el resto de la herramienta (copiar imagen,
   descargar, copiar texto) sigue funcionando exactamente igual que antes.
---------------------------------------------------------------------------- */
const FIREBASE_CONFIG = {
  apiKey: '',
  authDomain: '',
  databaseURL: '',
  projectId: '',
};
const FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);

let firebaseDbInstance = null;
function getFirebaseDb() {
  if (!FIREBASE_ENABLED) return null;
  if (firebaseDbInstance) return firebaseDbInstance;
  try {
    if (typeof firebase === 'undefined') return null;
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebaseDbInstance = firebase.database();
    return firebaseDbInstance;
  } catch (err) {
    console.error('No se pudo inicializar Firebase:', err);
    return null;
  }
}

function genEventId() {
  return 'evt_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

/* Escribe el evento "pending" en Firebase y va avisando por `onStatus` a
   medida que cambia: 'waiting' (recién escrito, esperando al bot),
   'posted' (el bot ya lo publicó en Discord) o 'error'. Devuelve el
   eventId para poder después escuchar las anotaciones con
   watchEventSignups. */
function publishEventToDiscord({ title, when, notes, roster, channelId }, onStatus) {
  const db = getFirebaseDb();
  if (!db) {
    onStatus({ state: 'error', message: 'Firebase no está configurado en esta página (ver discord-bot/README.md).' });
    return null;
  }

  const eventId = genEventId();
  const payload = {
    status: 'pending',
    title,
    when: when || null,
    notes: notes || null,
    guildName: state.guildName || 'PVPX',
    channelId: channelId || null,
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    roster: roster.map(s => {
      const g = invitationGearLine(s);
      return { role: s.role, weaponName: shortEsName(g.weapon.name), gearText: g.text };
    }),
  };

  const ref = db.ref('events/' + eventId);
  ref.set(payload)
    .then(() => {
      onStatus({ state: 'waiting', eventId });
      ref.on('value', (snap) => {
        const val = snap.val();
        if (!val) return;
        if (val.status === 'posted') {
          onStatus({ state: 'posted', eventId, messageId: val.messageId, channelId: val.channelId });
        } else if (val.status === 'error') {
          onStatus({ state: 'error', message: val.error || 'El bot no pudo publicar el evento — revisá que esté corriendo.' });
        }
      });
    })
    .catch((err) => {
      onStatus({ state: 'error', message: err.message || String(err) });
    });

  return eventId;
}

/* Escucha en vivo quién se anotó a cada rol de un evento ya publicado.
   Devuelve una función para dejar de escuchar (se llama al cerrar el
   modal, para no dejar listeners de Firebase colgados). */
function watchEventSignups(eventId, onSignups) {
  const db = getFirebaseDb();
  if (!db) return () => {};
  const ref = db.ref('events/' + eventId + '/signups');
  const handler = (snap) => onSignups(snap.val() || {});
  ref.on('value', handler);
  return () => ref.off('value', handler);
}

/* Carga un ícono de Render Service en modo CORS-anónimo para poder dibujarlo
   en canvas sin "mancharlo" (lo que impediría exportar la imagen después).
   Si el ícono no carga (falla de red, CORS, nombre no exacto) o tarda más
   de 6s, resuelve null y quien dibuja usa un emoji de respaldo — la
   invitación nunca queda rota por un ícono puntual. */
function loadOneImg(src, timeoutMs) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    const finish = (result) => { if (!done) { done = true; resolve(result); } };
    img.onload = () => finish(img);
    img.onerror = () => finish(null);
    img.src = src;
    setTimeout(() => finish(null), timeoutMs);
  });
}
function loadIconImg(suffix) {
  const url = iconUrl(suffix);
  if (!url) return Promise.resolve(null);
  return loadOneImg(url, 6000).then(img => {
    if (img) return img;
    // El pedido directo en modo CORS puede fallar si el Render Service de
    // Albion no manda encabezados CORS en ese momento (el ícono se ve bien
    // como <img> normal en el resto de la herramienta, pero un canvas
    // necesita CORS para poder exportarse después) — se reintenta una vez
    // a través de un proxy de imágenes público que sí los agrega, para no
    // perder el ícono real. Si esto también falla, se usa el emoji de
    // respaldo — la invitación nunca se rompe por esto.
    const bare = url.replace(/^https?:\/\//, '');
    const proxied = `https://images.weserv.nl/?url=${encodeURIComponent(bare)}`;
    return loadOneImg(proxied, 6000);
  });
}
async function loadIconCache(suffixes) {
  const unique = [...new Set(suffixes.filter(Boolean))];
  const cache = new Map();
  await Promise.all(unique.map(async (suffix) => { cache.set(suffix, await loadIconImg(suffix)); }));
  return cache;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
  ctx.beginPath();
  ctx.moveTo(x + r.tl, y);
  ctx.lineTo(x + w - r.tr, y);
  ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
  ctx.lineTo(x + w, y + h - r.br);
  ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
  ctx.lineTo(x + r.bl, y + h);
  ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
  ctx.lineTo(x + r.tl, y);
  ctx.arcTo(x, y, x + r.tl, y, r.tl);
  ctx.closePath();
}

function wrapCanvasText(ctx, text, maxWidth) {
  const words = String(text || '').split(' ');
  const lines = [];
  let cur = '';
  words.forEach(word => {
    const test = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(test).width > maxWidth) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  });
  if (cur) lines.push(cur);
  return lines;
}

/* Arma la imagen PNG completa de la invitación. Es async porque primero
   espera a que carguen las tipografías (Cinzel/Rajdhani, ya usadas en el
   resto de la herramienta) y todos los íconos de equipo en paralelo, para
   poder calcular alturas exactas antes de dibujar nada. */
async function buildInvitationCanvas({ title, when, notes, roster, label }) {
  try {
    if (document.fonts && document.fonts.load) {
      await Promise.all([
        document.fonts.load('900 34px Cinzel'),
        document.fonts.load('700 19px Cinzel'),
        document.fonts.load('700 20px Cinzel'),
        document.fonts.load('700 14px Rajdhani'),
        document.fonts.load('600 14px Rajdhani'),
        document.fonts.load('600 15px Rajdhani'),
        document.fonts.load('500 14px Rajdhani'),
      ]);
    }
  } catch (err) { /* si no cargan las fuentes, seguimos con las del sistema */ }

  const gearLines = roster.map(invitationGearLine);
  const neededSuffixes = [];
  gearLines.forEach(g => {
    if (g.weapon.u) neededSuffixes.push(g.weapon.u);
    if (g.helm) neededSuffixes.push(g.helm[1]);
    if (g.chest) neededSuffixes.push(g.chest[1]);
    if (g.boots) neededSuffixes.push(g.boots[1]);
    if (g.cape) neededSuffixes.push(g.cape[1]);
  });
  const iconCache = await loadIconCache(neededSuffixes);

  const SCALE = 2;
  const W = 900;
  const PAD = 34;
  const subtitle = when;

  // Medimos primero en un canvas descartable para calcular alturas exactas
  // (el título puede ocupar 1 o 2 líneas según cuánto escriba cada usuario).
  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = "900 34px Cinzel, serif";
  const titleLines = wrapCanvasText(mctx, title, W - PAD * 2).slice(0, 2);
  // Replica exactamente los mismos incrementos que el dibujo real más abajo,
  // así el alto reservado siempre alcanza sin importar cuántas líneas ocupe
  // el título ni si hay subtítulo (evita que el renglón de abajo se pise).
  let headerContentBottom = 82 + titleLines.length * 40;
  if (subtitle) headerContentBottom += 26;
  const headerH = headerContentBottom + 44; // espacio para el renglón "X jugadores requeridos" + padding

  mctx.font = "italic 500 13px Rajdhani, sans-serif";
  const noteLines = notes ? wrapCanvasText(mctx, `📌 ${notes}`, W - PAD * 2) : [];

  const listLineH = 24;
  const listH = 54 + gearLines.length * listLineH + (noteLines.length ? noteLines.length * 18 + 8 : 0);

  const cardW = (W - PAD * 2 - 16) / 2;
  const cardH = 132;
  const rows = Math.ceil(roster.length / 2);
  const gridH = 58 + rows * (cardH + 14);

  const footerH = 92;
  const H = headerH + listH + gridH + footerH + PAD;

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W * SCALE);
  canvas.height = Math.round(H * SCALE);
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // Fondo general
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#161616');
  bgGrad.addColorStop(1, '#0c0c0c');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#c8102e';
  ctx.lineWidth = 3;
  drawRoundRect(ctx, 3, 3, W - 6, H - 6, 14);
  ctx.stroke();

  // ---- Header banner ----
  const headerGrad = ctx.createLinearGradient(0, 0, W, 0);
  headerGrad.addColorStop(0, '#c8102e');
  headerGrad.addColorStop(1, '#7a0a1e');
  ctx.fillStyle = headerGrad;
  drawRoundRect(ctx, 0, 0, W, headerH, { tl: 12, tr: 12, br: 0, bl: 0 });
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = "600 14px Rajdhani, sans-serif";
  ctx.fillText(`⚔ ${state.guildName || 'PVPX'} · ${label}`, PAD, 40);

  ctx.fillStyle = '#ffffff';
  ctx.font = "900 34px Cinzel, serif";
  let ty = 82;
  titleLines.forEach(line => { ctx.fillText(line, PAD, ty); ty += 40; });

  if (subtitle) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.font = "600 17px Rajdhani, sans-serif";
    ctx.fillText(`🗓️ ${subtitle}`, PAD, ty - 4);
    ty += 26;
  }

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.font = "600 14px Rajdhani, sans-serif";
  ctx.fillText(`👥 ${roster.length} jugador${roster.length === 1 ? '' : 'es'} requeridos`, PAD, headerH - 18);

  let y = headerH + 30;
  // ---- Lista de equipo (texto) ----
  ctx.fillStyle = '#ff2d43';
  ctx.font = "700 19px Cinzel, serif";
  ctx.fillText('COMPOSICIÓN REQUERIDA', PAD, y);
  y += 12;
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, y + 6); ctx.lineTo(W - PAD, y + 6); ctx.stroke();
  y += 30;

  gearLines.forEach((g, i) => {
    const accent = ROLE_ACCENT[roster[i].role] || '#c8102e';
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(PAD + 4, y - 5, 4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#f4f4f4';
    ctx.font = "700 14.5px Rajdhani, sans-serif";
    const roleLabel = `${g.def.icon} ${g.def.label}: `;
    ctx.fillText(roleLabel, PAD + 16, y);
    const roleLabelW = ctx.measureText(roleLabel).width;

    ctx.fillStyle = '#c9c9c9';
    ctx.font = "500 14px Rajdhani, sans-serif";
    ctx.fillText(`${g.text}.`, PAD + 16 + roleLabelW, y);
    y += listLineH;
  });

  if (noteLines.length) {
    y += 8;
    ctx.fillStyle = '#9a9a9a';
    ctx.font = "italic 500 13px Rajdhani, sans-serif";
    noteLines.forEach(l => { ctx.fillText(l, PAD, y); y += 18; });
  }

  y += 22;
  // ---- Grid visual de roles (íconos reales de la build; si el ícono real
  //      de una pieza puntual no carga, se usa un emoji de respaldo) ----
  ctx.fillStyle = '#ff2d43';
  ctx.font = "700 19px Cinzel, serif";
  ctx.fillText('EQUIPO — VISTA RÁPIDA', PAD, y);
  y += 12;
  ctx.beginPath(); ctx.moveTo(PAD, y + 6); ctx.lineTo(W - PAD, y + 6); ctx.stroke();
  y += 28;
  const gridTop = y;

  gearLines.forEach((g, i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const cx = PAD + col * (cardW + 16);
    const cy = gridTop + row * (cardH + 14);
    const accent = ROLE_ACCENT[roster[i].role] || '#c8102e';

    ctx.fillStyle = '#161616';
    drawRoundRect(ctx, cx, cy, cardW, cardH, 10);
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    drawRoundRect(ctx, cx, cy, cardW, cardH, 10);
    ctx.stroke();
    ctx.fillStyle = accent;
    drawRoundRect(ctx, cx, cy, 5, cardH, { tl: 10, bl: 10, tr: 0, br: 0 });
    ctx.fill();

    ctx.fillStyle = accent;
    ctx.font = "700 13px Rajdhani, sans-serif";
    ctx.fillText(`${g.def.icon} ${g.def.label.toUpperCase()}`, cx + 16, cy + 20);
    ctx.fillStyle = '#f4f4f4';
    ctx.font = "600 13.5px Rajdhani, sans-serif";
    const wLines = wrapCanvasText(ctx, shortEsName(g.weapon.name), cardW - 30);
    ctx.fillText(wLines[0] || '', cx + 16, cy + 38);

    const iconSize = 42;
    const iconGap = 7;
    const iconsY = cy + 50;
    const pieces = [
      [g.weapon.u ? [g.weapon.name, g.weapon.u] : null, g.def.icon],
      [g.helm, '🪖'],
      [g.chest, '👕'],
      [g.cape, '🧣'],
      [g.boots, '👢'],
    ];
    pieces.forEach(([piece, emoji], idx) => {
      const ix = cx + 16 + idx * (iconSize + iconGap);
      ctx.fillStyle = '#0a0a0a';
      drawRoundRect(ctx, ix, iconsY, iconSize, iconSize, 8);
      ctx.fill();
      ctx.strokeStyle = '#2a2a2a';
      ctx.lineWidth = 1;
      drawRoundRect(ctx, ix, iconsY, iconSize, iconSize, 8);
      ctx.stroke();
      const img = piece ? iconCache.get(piece[1]) : null;
      if (img) {
        ctx.save();
        drawRoundRect(ctx, ix + 2, iconsY + 2, iconSize - 4, iconSize - 4, 6);
        ctx.clip();
        ctx.drawImage(img, ix + 2, iconsY + 2, iconSize - 4, iconSize - 4);
        ctx.restore();
      } else {
        // Algunos glifos (ej. "✚") no tienen presentación a color garantizada
        // y caen a un trazo monocromo que toma el fillStyle actual — si no
        // se resetea acá, hereda el negro de fondo de la casilla y queda
        // invisible. Por eso se fija un color claro explícito antes de
        // dibujarlo, sin importar qué carácter sea.
        ctx.fillStyle = '#f4f4f4';
        ctx.font = "22px sans-serif";
        ctx.textAlign = 'center';
        ctx.fillText(emoji, ix + iconSize / 2, iconsY + iconSize / 2 + 8);
        ctx.textAlign = 'left';
      }
    });
  });
  y = gridTop + rows * (cardH + 14) + 18;

  // ---- Footer / llamado a la acción ----
  const footerGrad = ctx.createLinearGradient(0, y, W, y);
  footerGrad.addColorStop(0, '#7a0a1e');
  footerGrad.addColorStop(1, '#c8102e');
  ctx.fillStyle = footerGrad;
  drawRoundRect(ctx, 0, y, W, H - y, { tl: 0, tr: 0, br: 12, bl: 12 });
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = "700 20px Cinzel, serif";
  ctx.fillText('✅ ¡ANOTATE PARA PARTICIPAR!', W / 2, y + 40);
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = "600 14.5px Rajdhani, sans-serif";
  ctx.fillText('Respondé con tu rol y arma disponible para reservar tu lugar 👇', W / 2, y + 66);
  ctx.textAlign = 'left';

  return canvas;
}

/* Modal con el formulario (título/fecha/notas) + vista previa de la
   invitación generada, reutilizando el mismo overlay que la Guía y los
   selectores de equipo (guarda contenido HTML propio en #modalGuide). */
function openInvitationModal() {
  const data = currentInvitationRoster();
  if (!data || !data.roster.length) {
    showToast('Elegí una build con jugadores para generar la invitación');
    return;
  }
  const { entry, roster, label } = data;
  const defaultTitle = `${label} — ${entry.name}`;

  document.getElementById('modalTitle').textContent = '🎉 Invitación para Discord';
  document.getElementById('modalText').style.display = 'none';
  document.getElementById('modalFoot').style.display = 'none';
  document.getElementById('modalBox').classList.add('wide');
  const guide = document.getElementById('modalGuide');
  guide.style.display = '';
  guide.innerHTML = '';

  const form = document.createElement('div');
  form.className = 'invite-form';

  function fieldRow(labelText, placeholder, value, type) {
    const lbl = document.createElement('label');
    lbl.className = 'invite-label';
    lbl.appendChild(document.createTextNode(labelText));
    const input = document.createElement('input');
    input.type = type || 'text';
    if (placeholder) input.placeholder = placeholder;
    if (value) input.value = value;
    lbl.appendChild(input);
    return { lbl, input };
  }

  // Fecha y hora: en vez de un solo <input type="datetime-local"> (cuyo
  // reloj nativo puede mostrar AM/PM según el idioma del navegador del
  // usuario, algo que no se puede forzar de forma confiable desde la
  // página), se arma con un <input type="date"> (ese sí es siempre un
  // calendario, sin ambigüedad de horario) más dos <select> propios de
  // hora (00-23) y minuto, con las opciones escritas a mano en formato de
  // 24 horas — así nunca puede aparecer AM/PM sin importar el navegador o
  // la configuración regional de quien la usa. Sigue siendo "con
  // selección" (nada de tipear texto libre), solo que ya no depende del
  // widget nativo del navegador para el horario.
  function dateTimeRow(labelText) {
    const lbl = document.createElement('label');
    lbl.className = 'invite-label';
    lbl.appendChild(document.createTextNode(labelText));
    const wrap = document.createElement('div');
    wrap.className = 'invite-datetime-wrap';

    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.className = 'invite-date-input';
    wrap.appendChild(dateInput);

    const hourSelect = document.createElement('select');
    hourSelect.className = 'invite-hour-select';
    hourSelect.setAttribute('aria-label', 'Hora (24 hs)');
    for (let h = 0; h < 24; h++) {
      const opt = document.createElement('option');
      opt.value = String(h).padStart(2, '0');
      opt.textContent = String(h).padStart(2, '0');
      hourSelect.appendChild(opt);
    }
    wrap.appendChild(hourSelect);

    const sep = document.createElement('span');
    sep.className = 'invite-time-sep';
    sep.textContent = ':';
    wrap.appendChild(sep);

    const minuteSelect = document.createElement('select');
    minuteSelect.className = 'invite-minute-select';
    minuteSelect.setAttribute('aria-label', 'Minuto');
    [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55].forEach(m => {
      const opt = document.createElement('option');
      opt.value = String(m).padStart(2, '0');
      opt.textContent = String(m).padStart(2, '0');
      minuteSelect.appendChild(opt);
    });
    wrap.appendChild(minuteSelect);

    lbl.appendChild(wrap);
    return {
      lbl, dateInput, hourSelect, minuteSelect,
      getValue: () => dateInput.value ? `${dateInput.value}T${hourSelect.value}:${minuteSelect.value}` : '',
    };
  }

  const titleRow = fieldRow('Título del evento', '', defaultTitle);
  titleRow.input.maxLength = 70;
  // Se elige en el horario local de quien arma la invitación y se muestra
  // en la invitación ya convertida a UTC (en formato 24 hs, sin AM/PM),
  // para que nadie del gremio tenga dudas sin importar en qué huso horario
  // esté ni qué navegador use.
  const whenRow = dateTimeRow('Fecha y hora (opcional — 24 hs, se muestra en UTC)');
  const notesRow = fieldRow('Notas para quien se anote (opcional)', 'Ej: Traé poción y comida en el inventario');
  notesRow.input.maxLength = 120;

  form.appendChild(titleRow.lbl);
  form.appendChild(whenRow.lbl);
  form.appendChild(notesRow.lbl);

  let channelRow = null;
  if (FIREBASE_ENABLED) {
    channelRow = fieldRow('Canal de Discord para publicar (ID, opcional)', 'Vacío = canal por defecto del bot');
    channelRow.input.maxLength = 30;
    form.appendChild(channelRow.lbl);
  }

  const genBtn = document.createElement('button');
  genBtn.type = 'button';
  genBtn.className = 'primary';
  genBtn.style.marginTop = '2px';
  genBtn.textContent = '🖼 Generar invitación';
  form.appendChild(genBtn);

  guide.appendChild(form);

  const previewWrap = document.createElement('div');
  previewWrap.id = 'invitePreviewWrap';
  previewWrap.style.marginTop = '18px';
  guide.appendChild(previewWrap);

  genBtn.onclick = async () => {
    const title = titleRow.input.value.trim() || defaultTitle;
    const when = formatWhenUTC(whenRow.getValue());
    const notes = notesRow.input.value.trim();
    const channelId = channelRow ? channelRow.input.value.trim() : '';
    genBtn.disabled = true;
    genBtn.textContent = '⏳ Generando...';
    try {
      const canvas = await buildInvitationCanvas({ title, when, notes, roster, label });
      renderInvitationPreview(canvas, title, invitationTextBlock(title, when, notes, roster), { title, when, notes, roster, channelId });
    } catch (err) {
      showToast('No se pudo generar la imagen ✕');
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = '🖼 Generar invitación';
    }
  };

  document.getElementById('modalOverlay').classList.add('show');
}

function renderInvitationPreview(canvas, title, text, syncData) {
  const wrap = document.getElementById('invitePreviewWrap');
  if (!wrap) return;
  stopActiveSignupWatch();
  wrap.innerHTML = '';

  const img = document.createElement('img');
  img.src = canvas.toDataURL('image/png');
  img.alt = 'Vista previa de la invitación';
  wrap.appendChild(img);

  const actions = document.createElement('div');
  actions.className = 'invite-actions';

  const copyImgBtn = document.createElement('button');
  copyImgBtn.type = 'button';
  copyImgBtn.className = 'primary';
  copyImgBtn.textContent = '📋 Copiar imagen';
  copyImgBtn.onclick = () => {
    if (!navigator.clipboard || !window.ClipboardItem) {
      showToast('Tu navegador no permite copiar imágenes — usá "Descargar imagen" ✕');
      return;
    }
    try {
      const item = new ClipboardItem({
        'image/png': new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('sin blob')), 'image/png');
        }),
      });
      navigator.clipboard.write([item])
        .then(() => showToast('Imagen copiada — pegala en Discord con Ctrl+V ✔'))
        .catch(() => showToast('No se pudo copiar la imagen — probá "Descargar imagen" ✕'));
    } catch (err) {
      showToast('No se pudo copiar la imagen — probá "Descargar imagen" ✕');
    }
  };
  actions.appendChild(copyImgBtn);

  const dlBtn = document.createElement('button');
  dlBtn.type = 'button';
  dlBtn.className = 'ghost';
  dlBtn.textContent = '⬇ Descargar imagen';
  dlBtn.onclick = () => {
    const safe = (title || 'invitacion').replace(/[^a-z0-9áéíóúñ_-]+/gi, '_').slice(0, 60) || 'invitacion';
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `invitacion_${safe}.png`;
    a.click();
  };
  actions.appendChild(dlBtn);

  const copyTextBtn = document.createElement('button');
  copyTextBtn.type = 'button';
  copyTextBtn.className = 'ghost';
  copyTextBtn.textContent = '📋 Copiar texto';
  copyTextBtn.onclick = () => {
    navigator.clipboard.writeText(text)
      .then(() => showToast('Texto copiado ✔'))
      .catch(() => showToast('No se pudo copiar el texto ✕'));
  };
  actions.appendChild(copyTextBtn);

  wrap.appendChild(actions);

  if (syncData) wrap.appendChild(buildLiveSyncSection(syncData));
}

/* Función para cortar el listener de Firebase de la lista de anotados en
   vivo que pueda haber quedado activo (se llama al generar una invitación
   nueva o al cerrar el modal) — evita dejar listeners colgados escuchando
   de más. */
let stopSignupWatch = null;
function stopActiveSignupWatch() {
  if (stopSignupWatch) { stopSignupWatch(); stopSignupWatch = null; }
}

/* Arma el bloque "Sincronización en vivo con Discord" que va debajo de los
   botones de copiar/descargar: si Firebase no está configurado en esta
   página, muestra solo una nota explicando cómo activarlo; si sí lo está,
   muestra el botón para publicar y, una vez publicado, la lista de quién
   se anotó a cada rol actualizándose en vivo. */
function buildLiveSyncSection({ title, when, notes, roster, channelId }) {
  const box = document.createElement('div');
  box.className = 'live-sync-box';

  if (!FIREBASE_ENABLED) {
    box.innerHTML = `<p class="live-sync-hint">🔌 La sincronización en vivo con Discord no está configurada en esta página — para activarla, completá <code>FIREBASE_CONFIG</code> en el archivo y tené el bot corriendo (ver <code>discord-bot/README.md</code>).</p>`;
    return box;
  }

  const head = document.createElement('div');
  head.className = 'live-sync-head';
  head.innerHTML = `<b>🔴 Sincronización en vivo con Discord</b>`;
  box.appendChild(head);

  const publishBtn = document.createElement('button');
  publishBtn.type = 'button';
  publishBtn.className = 'primary';
  publishBtn.textContent = '📡 Publicar y sincronizar con Discord';
  box.appendChild(publishBtn);

  const statusEl = document.createElement('div');
  statusEl.className = 'live-sync-status';
  box.appendChild(statusEl);

  const boardEl = document.createElement('div');
  boardEl.className = 'live-sync-board';
  box.appendChild(boardEl);

  function renderBoard(signups) {
    boardEl.innerHTML = '';
    const rolesPresentes = [...new Set(roster.map(s => s.role))];
    rolesPresentes.forEach(role => {
      const def = ROLES[role];
      const people = signups && signups[role] ? Object.values(signups[role]) : [];
      const row = document.createElement('div');
      row.className = 'live-sync-role-row';
      const namesText = people.length
        ? people.map(p => p.username).join(', ')
        : '— nadie anotado todavía —';
      row.innerHTML = `<span class="live-sync-role-tag">${def.icon} ${def.label} (${people.length})</span><span class="live-sync-role-names">${namesText}</span>`;
      boardEl.appendChild(row);
    });
  }

  publishBtn.onclick = () => {
    publishBtn.disabled = true;
    publishBtn.textContent = '⏳ Publicando...';
    statusEl.textContent = '';
    publishEventToDiscord({ title, when, notes, roster, channelId }, (status) => {
      if (status.state === 'waiting') {
        statusEl.textContent = '⏳ Esperando que el bot lo publique en Discord...';
      } else if (status.state === 'posted') {
        statusEl.textContent = '✅ Publicado en Discord — reaccionando en el mensaje se anota la gente acá abajo en vivo.';
        publishBtn.style.display = 'none';
        stopActiveSignupWatch();
        stopSignupWatch = watchEventSignups(status.eventId, renderBoard);
      } else if (status.state === 'error') {
        statusEl.textContent = `✕ ${status.message}`;
        publishBtn.disabled = false;
        publishBtn.textContent = '📡 Publicar y sincronizar con Discord';
      }
    });
  };

  return box;
}

function openModal(title, text) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').value = text;
  document.getElementById('modalText').style.display = '';
  document.getElementById('modalGuide').style.display = 'none';
  document.getElementById('modalFoot').style.display = '';
  document.getElementById('modalBox').classList.remove('wide');
  document.getElementById('modalOverlay').classList.add('show');
}

/* Variante del modal que muestra HTML con títulos reales en vez de texto
   plano — se usa para la Guía, donde la jerarquía visual importa más que
   poder copiar el contenido. */
function openGuideModal(title, html) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').style.display = 'none';
  const guide = document.getElementById('modalGuide');
  guide.style.display = '';
  guide.innerHTML = html;
  document.getElementById('modalFoot').style.display = 'none';
  document.getElementById('modalBox').classList.add('wide');
  document.getElementById('modalOverlay').classList.add('show');
}

function pickerIcon(name, suffix) {
  const box = document.createElement('span');
  box.className = 'gear-picker-icon';
  box.textContent = '❔';
  const url = iconUrl(suffix);
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = name;
    img.onerror = () => { box.textContent = '❔'; };
    box.textContent = '';
    box.appendChild(img);
  }
  return box;
}

/* Modal para elegir manualmente una pieza de equipo (casco/capa/pecho/botas/
   off-hand) para un jugador puntual, sin importar qué traiga su build por
   defecto. `onSelect` recibe la clave elegida del catálogo, 'NONE' (solo si
   allowNone) o null para volver al valor por defecto de la build. */
function openGearPicker(pieceLabel, catalog, currentKey, allowNone, onSelect, showReset) {
  document.getElementById('modalTitle').textContent = `Elegir ${pieceLabel}`;
  document.getElementById('modalText').style.display = 'none';
  const guide = document.getElementById('modalGuide');
  guide.style.display = '';
  guide.innerHTML = '';
  document.getElementById('modalFoot').style.display = 'none';
  document.getElementById('modalBox').classList.add('wide');

  const close = () => document.getElementById('modalOverlay').classList.remove('show');

  const actions = document.createElement('div');
  actions.className = 'gear-picker-actions';
  if (showReset !== false) {
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'ghost small';
    resetBtn.textContent = '↺ Usar el de la build (por defecto)';
    resetBtn.onclick = () => { onSelect(null); close(); };
    actions.appendChild(resetBtn);
  }
  if (allowNone) {
    const noneBtn = document.createElement('button');
    noneBtn.type = 'button';
    noneBtn.className = 'ghost small';
    noneBtn.textContent = '— Sin off-hand';
    noneBtn.onclick = () => { onSelect('NONE'); close(); };
    actions.appendChild(noneBtn);
  }
  if (actions.children.length) guide.appendChild(actions);

  function makeItem(key, name, suffix) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gear-picker-item' + (key === currentKey ? ' active' : '');
    btn.appendChild(pickerIcon(name, suffix));
    const nm = document.createElement('span');
    nm.className = 'gear-picker-name';
    nm.textContent = shortEsName(name);
    btn.title = name;
    btn.appendChild(nm);
    btn.onclick = () => { onSelect(key); close(); };
    return btn;
  }

  // El catálogo puede venir agrupado (array de {label, entries}) — por
  // familia de arma o por material/facción de armadura — o plano (dict
  // simple, como las capas). Agrupado: se muestra un título por sección
  // para que "se desplieguen separadas por los diferentes tipos que hay".
  if (Array.isArray(catalog)) {
    catalog.forEach(group => {
      const keys = Object.keys(group.entries);
      if (!keys.length) return;
      const h = document.createElement('div');
      h.className = 'gear-picker-group-title';
      h.textContent = group.label;
      guide.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'gear-picker-grid';
      keys.forEach(key => {
        const [name, suffix] = group.entries[key];
        grid.appendChild(makeItem(key, name, suffix));
      });
      guide.appendChild(grid);
    });
  } else {
    const grid = document.createElement('div');
    grid.className = 'gear-picker-grid';
    Object.keys(catalog).forEach(key => {
      const [name, suffix] = catalog[key];
      grid.appendChild(makeItem(key, name, suffix));
    });
    guide.appendChild(grid);
  }

  document.getElementById('modalOverlay').classList.add('show');
}

/* ---------------- Tema claro / oscuro ---------------- */
let theme = 'dark';
function applyTheme() {
  const btn = document.getElementById('btnTheme');
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    btn.textContent = '☀️ Claro';
  } else {
    document.documentElement.removeAttribute('data-theme');
    btn.textContent = '🌙 Oscuro';
  }
}

/* Refleja el nombre del gremio en el título de la pestaña, el chip del
   header y el pie de página, para que se note claramente de qué gremio
   es la herramienta. */
function updateGuildBranding() {
  const name = (state.guildName || 'PVPX').trim() || 'PVPX';
  document.title = `${name} — Compositor de Grupos · Albion Online`;
  const brand = document.getElementById('brandTitle');
  if (brand) brand.textContent = name.toUpperCase();
}

/* ---------------- Eventos globales ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  // Recupera el autoguardado de este navegador (si existe) antes del primer
  // render, así se retoma exactamente donde se dejó la última vez.
  const saved = loadFromStorage();
  if (saved) applyState(saved);

  updateGuildBranding();

  document.getElementById('btnTheme').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  };
  applyTheme();

  document.getElementById('btnCopy').onclick = () => {
    openModal('Composición lista para Discord', textReport());
  };
  document.getElementById('btnInvite').onclick = () => {
    if (!currentInvitationRoster()) {
      showToast('La invitación está disponible en Composición y Avalón — elegí una build primero');
      return;
    }
    openInvitationModal();
  };
  document.getElementById('btnExport').onclick = () => {
    const guild = (state.guildName || 'gremio').replace(/[^a-z0-9áéíóúñ_-]+/gi, '_');
    downloadFile(`albion_composicion_${guild}.json`, serializeState(), 'application/json');
    showToast('Archivo exportado ✔');
  };
  document.getElementById('btnImportTrigger').onclick = () => {
    document.getElementById('btnImport').click();
  };
  document.getElementById('btnImport').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        applyState(data);
        updateGuildBranding();
        renderAll();
        showToast('Composición importada ✔');
      } catch (err) {
        showToast('Error al leer el archivo ✕');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('btnReset').onclick = () => {
    if (state.mode === 'balance') { showToast('El balance no se reinicia desde acá — quitá jugadores uno por uno con el ✕'); return; }
    if (SOLO_MODES.includes(state.mode)) {
      if (!confirm('¿Restaurar el equipamiento por defecto de la build de esta pestaña? Se perderán el arma y las piezas que hayas cambiado a mano.')) return;
      SOLO_BUILDS[state.mode].forEach(b => { state.soloOverrides[b.id] = { gear: {}, weapon: null }; });
      renderPanel();
      return;
    }
    if (!confirm('¿Reiniciar ESTA build a la plantilla sugerida? Se perderán los cambios de equipo hechos en esta build. (No afecta a tus otras builds guardadas, ni al Balance, ni a Solitario.)')) return;
    const entry = currentCompEntry();
    if (entry) entry.roster = buildSlotsFromTemplate(defaultTemplateFor(state.mode));
    renderPanel();
  };

  document.getElementById('btnHelp').onclick = () => {
    const rolesHtml = ROLE_KEYS.map(k => {
      const def = ROLES[k];
      const accent = ROLE_ACCENT[k] || 'var(--red)';
      return `<div class="guide-role-item" style="--accent:${accent}">
        <div class="guide-role-head"><span>${def.icon}</span><b>${def.label}</b></div>
        <div class="guide-role-desc">${def.desc}</div>
        <div class="guide-role-armor"><b>Armadura base:</b> ${def.armor}</div>
      </div>`;
    }).join('');

    const doctrinesHtml = Object.keys(ZVZ_VARIANTS).map(k => {
      const v = ZVZ_VARIANTS[k];
      return `<div class="guide-mode-item"><b>${v.icon} ${v.label}</b> — ${v.desc}</div>`;
    }).join('');

    const modesHtml = `
      <div class="guide-mode-item"><b>⚔️ ZVZ</b> — ${MODES.zvz.desc}. Podés crear hasta 4 grupos para un mismo evento (40/60/80 jugadores).</div>
      <div class="guide-mode-item"><b>🛡️ Grupales</b> — ${MODES.grupal.desc} (small-scale, hellgates, roads).</div>
      <div class="guide-mode-item"><b>⭐ Estática</b> — ${MODES.estatica.desc}.</div>
    `;

    const html = `
      <h4>Roles</h4>
      <div class="guide-roles">${rolesHtml}</div>
      <h4>Modalidades</h4>
      ${modesHtml}
      <h4>Doctrinas ZVZ</h4>
      ${doctrinesHtml}
      <h4>Balance de jugadores</h4>
      <div class="guide-mode-item">💰 Registrá el saldo de plata de cada miembro del gremio: sumalo cuando se reparte loot, restalo cuando alguien retira, y consultá el historial completo de movimientos de cada jugador — todo desde la pestaña <b>Balance</b> del menú principal.</div>
      <h4>Equipo de cada build</h4>
      <div class="guide-note">Cada build incluye arma, casco, pecho, botas y capa sugeridos, con íconos oficiales de Albion Online. Podés cambiar cualquier pieza desde los selects de cada tarjeta según lo que tenga disponible cada jugador.</div>
    `;
    openGuideModal('Guía rápida de roles y doctrinas', html);
  };

  document.getElementById('modalClose').onclick = () => { document.getElementById('modalOverlay').classList.remove('show'); stopActiveSignupWatch(); };
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') { e.currentTarget.classList.remove('show'); stopActiveSignupWatch(); }
  });
  document.getElementById('modalCopyBtn').onclick = () => {
    const ta = document.getElementById('modalText');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(() => showToast('Copiado al portapapeles ✔'))
      .catch(() => { document.execCommand('copy'); showToast('Copiado al portapapeles ✔'); });
  };

  renderAll();
});

</script>
</body>
</html>
