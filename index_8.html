<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVPX — Compositor de Grupos · Albion Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Solo se usan si completás FIREBASE_CONFIG dentro del script de esta
     página, para la sincronización en vivo con el bot de Discord (carpeta
     discord-bot/, ver su README.md) — si no lo completás, esta parte de la
     invitación simplemente no aparece y el resto de la herramienta sigue
     funcionando igual. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js" defer></script>
<style>
  :root{
    --bg:#0a0a0a;
    --bg-alt:#131313;
    --panel:#161616;
    --panel-2:#1d1d1d;
    --border:#2a2a2a;
    --red:#c8102e;
    --red-bright:#ff2d43;
    --red-dim:#5c0f18;
    --white:#f4f4f4;
    --grey:#9a9a9a;
    --grey-dim:#666;
    --radius:10px;
    --header-grad-1:#0d0d0d;
    --header-grad-2:#0a0a0a;
    --shadow-a:rgba(0,0,0,.55);
  }
  [data-theme="light"]{
    --bg:#f6f5f3;
    --bg-alt:#ffffff;
    --panel:#ffffff;
    --panel-2:#f0eeeb;
    --border:#e0ddd7;
    --red:#c8102e;
    --red-bright:#e0122f;
    --red-dim:#f6d3d8;
    --white:#181614;
    --grey:#5a5650;
    --grey-dim:#8a857c;
    --header-grad-1:#ffffff;
    --header-grad-2:#f6f5f3;
    --shadow-a:rgba(0,0,0,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(200,16,46,.10), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(200,16,46,.07), transparent 40%),
      var(--bg);
    color:var(--white);
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition:background .2s,color .2s;
  }
  h1,h2,h3,.brand{font-family:'Cinzel',serif;}
  ::selection{background:var(--red);color:#fff;}

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(180deg, var(--header-grad-1) 0%, var(--header-grad-2) 100%);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg, transparent, var(--red-bright) 20%, var(--red-bright) 80%, transparent) 1;
    padding:20px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 4px 22px var(--shadow-a);
  }
  .brand-block{display:flex;align-items:center;gap:18px;}
  .crest{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a0006, #000);
    border:3px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--red) 18%, transparent), 0 0 22px rgba(200,16,46,.65) inset, 0 0 18px rgba(200,16,46,.5);
    flex-shrink:0;
  }
  .brand-titles h1{
    margin:0;font-size:30px;letter-spacing:3px;color:var(--white);
    font-weight:900;text-transform:uppercase;
    text-shadow:0 0 22px rgba(200,16,46,.65), 0 2px 0 rgba(0,0,0,.4);
  }
  .brand-titles .sub{font-size:12px;color:var(--grey);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button, .btn{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:.4px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--white);
    padding:9px 14px;
    font-size:13.5px;
    transition:.15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  button:hover{border-color:var(--red);background:var(--panel-2);}
  button:active{transform:scale(.97);}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;}
  button.primary:hover{background:var(--red-bright);border-color:var(--red-bright);}
  button.ghost{background:transparent;}
  button.small{padding:5px 9px;font-size:12px;border-radius:6px;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  input[type=file]{display:none;}

  /* ---------- Menú unificado de modalidad (Composición / Balance) ---------- */
  .mode-bar{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:22px 28px 0;
  }
  .mode-menu{
    display:inline-flex;
    gap:5px;
    background:linear-gradient(165deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    border-radius:34px;
    padding:6px;
    flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .mode-item{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 24px;
    border-radius:28px;
    border:none;
    background:transparent;
    color:var(--grey);
    font-family:'Cinzel',serif;
    font-weight:800;
    font-size:14.5px;
    letter-spacing:.6px;
    text-transform:uppercase;
    cursor:pointer;
    transition:.18s;
  }
  .mode-item span:first-child{font-size:17px;}
  .mode-item:hover:not(.active){background:var(--panel-2);color:var(--white);}
  .mode-item.active{
    background:linear-gradient(120deg, var(--red-bright), var(--red));
    color:#fff;
    box-shadow:0 4px 16px rgba(200,16,46,.5), inset 0 1px 0 rgba(255,255,255,.25);
    transform:translateY(-1px);
  }
  .mode-desc{font-size:12.5px;color:var(--grey);font-style:italic;padding-left:6px;}

  /* Sub-menú dentro de la pestaña "Composición" para elegir ZVZ / Grupales /
     Estática — más chico que el menú principal para marcar que es un
     selector secundario dentro de la misma pestaña. */
  .submode-menu{
    display:inline-flex;
    gap:4px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:28px;
    padding:5px;
    flex-wrap:wrap;
    margin-left:2px;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.25);
  }
  .submode-item{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 18px;
    border-radius:22px;
    border:none;
    background:transparent;
    color:var(--grey);
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.3px;
    cursor:pointer;
    transition:.15s;
  }
  .submode-item:hover:not(.active){background:var(--panel-2);color:var(--white);}
  .submode-item.active{
    background:linear-gradient(120deg, var(--red-bright), var(--red));
    color:#fff;
    box-shadow:0 3px 10px rgba(200,16,46,.4);
  }

  main{padding:18px 28px 40px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
  }

  /* ---------- Summary strip ---------- */
  .summary-strip{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .stat{
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-left:3px solid var(--red);
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    color:var(--grey);
    min-width:120px;
  }
  .stat b{display:block;color:var(--white);font-size:18px;font-family:'Cinzel',serif;}

  /* ---------- Group tabs (ZVZ) ---------- */
  .group-bar{
    display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap;
    background:linear-gradient(165deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);border-radius:26px;padding:6px;
    box-shadow:0 3px 12px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .group-tab{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px 8px 20px;border-radius:20px;border:none;
    background:transparent;color:var(--grey);font-weight:800;font-size:13.5px;cursor:pointer;
    letter-spacing:.4px;transition:.16s;font-family:'Rajdhani',sans-serif;
  }
  .group-tab:hover:not(.active){background:var(--panel-2);color:var(--white);}
  .group-tab.active{
    background:linear-gradient(120deg, var(--red-bright), var(--red));
    border-color:var(--red);color:#fff;
    box-shadow:0 4px 14px rgba(200,16,46,.45), inset 0 1px 0 rgba(255,255,255,.2);
    transform:translateY(-1px);
  }
  .group-tab .count{opacity:.8;font-size:11px;}
  .tab-rename-btn{
    background:rgba(255,255,255,.08);border:none;color:inherit;opacity:.75;cursor:pointer;
    font-size:11px;line-height:1;padding:4px 6px;border-radius:8px;transition:.14s;
  }
  .tab-rename-btn:hover{opacity:1;background:rgba(255,255,255,.22);}

  /* ---------- Gear picker (equipment editing) ---------- */
  .doll-slot.editable{cursor:pointer;position:relative;}
  .doll-slot.editable .doll-icon-box{transition:.15s;}
  .doll-slot.editable:hover .doll-icon-box{
    border-color:var(--red-bright);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--red-bright) 40%, transparent), 0 0 14px rgba(200,16,46,.4);
  }
  .doll-edit-hint{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:var(--red-bright);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;opacity:0;transition:.15s;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .doll-slot.editable:hover .doll-edit-hint{opacity:1;}
  .gear-picker-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .gear-picker-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:10px;
  }
  .gear-picker-item{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 8px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-alt);cursor:pointer;transition:.15s;
    font-family:'Rajdhani',sans-serif;
  }
  .gear-picker-item:hover{border-color:var(--red-bright);background:var(--panel-2);transform:translateY(-2px);}
  .gear-picker-item.active{
    border-color:var(--red-bright);
    background:color-mix(in srgb, var(--red-bright) 14%, var(--bg-alt));
    box-shadow:0 0 0 1px var(--red-bright), 0 4px 14px rgba(200,16,46,.3);
  }
  .gear-picker-icon{
    width:56px;height:56px;border-radius:10px;background:var(--panel);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    border:1px solid var(--border);overflow:hidden;
  }
  .gear-picker-icon img{width:100%;height:100%;object-fit:contain;}
  .gear-picker-name{font-size:12px;color:var(--white);text-align:center;font-weight:600;line-height:1.25;}
  .gear-picker-group-title{
    font-family:'Cinzel',serif;font-weight:800;font-size:12.5px;color:var(--white);
    text-transform:uppercase;letter-spacing:.6px;
    margin:18px 0 8px;padding-left:10px;
    border-left:3px solid var(--red-bright);
  }
  .gear-picker-group-title:first-child{margin-top:0;}

  /* ---------- Roster grid ---------- */
  .roster-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .roster-head h2{margin:0;font-size:18px;color:var(--white);}
  .fill-bar-wrap{flex:1;min-width:160px;max-width:320px;height:8px;background:#000;border-radius:5px;overflow:hidden;border:1px solid var(--border);}
  .fill-bar{height:100%;background:linear-gradient(90deg,var(--red-dim),var(--red-bright));transition:.25s;}
  .quick-controls{display:flex;gap:6px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;
  }
  .slot-card{
    --accent:var(--red);
    background:var(--bg-alt);
    background:linear-gradient(165deg, color-mix(in srgb, var(--accent) 20%, var(--bg-alt)) 0%, var(--bg-alt) 58%);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:12px;
    padding:15px 13px 13px;
    position:relative;
    overflow:hidden;
    transition:.15s;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .slot-card:hover{border-color:var(--accent);box-shadow:0 6px 20px -3px color-mix(in srgb, var(--accent) 60%, transparent);}
  .slot-card:hover{border-top-color:var(--accent);}
  /* Marca de agua del ícono de rol — detalle de diseño extra por tarjeta */
  .slot-card::after{
    content:attr(data-role-icon);
    position:absolute;right:-10px;bottom:-20px;
    font-size:76px;line-height:1;
    opacity:.07;
    pointer-events:none;
    filter:grayscale(.4);
  }

  /* Cinta de rol — pieza clave para "resaltar" cada tarjeta con el color de su rol */
  .role-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent);
    color:#050505;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.3px;
    padding:4px 11px 4px 9px;
    border-radius:20px;
    margin:0 0 11px 0;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    font-family:'Rajdhani',sans-serif;
    position:relative;
    z-index:1;
  }

  /* Muñeco de equipo (paperdoll): imita la disposición de Albion al equipar
     al personaje — arma / casco / capa arriba, pecho / off-hand en medio,
     botas abajo. Cada casilla trae ícono grande + nombre del ítem en
     español debajo, para que se lea de un vistazo qué lleva puesto. */
  .paperdoll{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,auto);
    gap:9px;
    margin-bottom:12px;
    position:relative;
    z-index:1;
  }
  .doll-slot{display:flex;flex-direction:column;align-items:stretch;gap:4px;}
  .doll-icon-box{
    width:100%;aspect-ratio:1;
    border-radius:9px;
    background:#000;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .doll-slot.filled .doll-icon-box{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.45) inset, 0 0 11px -1px color-mix(in srgb, var(--accent) 75%, transparent);
    background:radial-gradient(circle at 50% 40%, #1a1a1a, #000);
  }
  .doll-slot.empty .doll-icon-box{opacity:.32;border-style:dashed;}
  .doll-slot.na .doll-icon-box{opacity:.18;border-style:dashed;}
  .doll-icon-box img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));}
  .doll-icon-box .fallback{font-size:28px;}
  .doll-icon-box .tier-badge{
    position:absolute;top:-1px;right:-1px;
    background:var(--accent);color:#050505;
    font-size:8px;font-weight:800;letter-spacing:.4px;
    padding:1px 4px;border-radius:0 7px 0 7px;
    font-family:'Rajdhani',sans-serif;
  }
  .doll-label{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2;padding:0 1px;}
  .doll-tag{
    font-size:8.5px;font-weight:800;letter-spacing:.4px;
    color:var(--grey-dim);text-transform:uppercase;
  }
  .doll-name{
    font-size:11px;font-weight:600;color:var(--grey);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }
  .food-slot{grid-column:1;grid-row:1;}
  .weapon-slot{grid-column:1;grid-row:2;}
  .helm-slot{grid-column:2;grid-row:1;}
  .cape-slot{grid-column:3;grid-row:1;}
  .chest-slot{grid-column:2;grid-row:2;}
  .off-slot{grid-column:3;grid-row:2;}
  .boots-slot{grid-column:2;grid-row:3;}

  .role-select, .weapon-select{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--white);
    padding:6px 7px;
    border-radius:6px;
    font-family:'Rajdhani',sans-serif;
    font-size:13.5px;
    font-weight:600;
    outline:none;
    position:relative;
    z-index:1;
  }
  .role-select{color:var(--red-bright);text-overflow:ellipsis;font-weight:700;}
  .role-select:focus, .weapon-select:focus, .player-input:focus{border-color:var(--accent);}
  .slot-card .selects{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;z-index:1;}
  .player-input{
    margin-top:10px;
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--white);
    padding:8px 10px;
    border-radius:6px;
    font-size:14.5px;
    outline:none;
    position:relative;
    z-index:1;
  }
  .player-input::placeholder{color:var(--grey-dim);}
  .remove-slot{
    position:absolute;top:6px;right:6px;z-index:2;
    width:20px;height:20px;border-radius:50%;
    background:transparent;border:1px solid var(--border);
    color:var(--grey);font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .remove-slot:hover{background:var(--red);border-color:var(--red);color:#fff;}

  .add-slot-card{
    border:1.5px dashed var(--border);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:var(--grey);
    font-weight:700;
    cursor:pointer;
    min-height:96px;
    background:transparent;
    font-size:13px;
  }
  .add-slot-card:hover{border-color:var(--red);color:var(--red-bright);}
  .add-slot-card:disabled{opacity:.3;cursor:not-allowed;}

  .empty-msg{color:var(--grey);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:10px;}

  /* ---------- Role legend ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);}
  .legend-item .dot{width:10px;height:10px;border-radius:3px;background:var(--red);}

  /* ---------- Pestaña Solitario (PvE / PvP) ---------- */
  .solo-note{
    display:flex;align-items:center;gap:8px;
    background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--red-bright);
    border-radius:8px;padding:10px 14px;margin-bottom:18px;
    font-size:12.5px;color:var(--grey);line-height:1.5;
  }
  .solo-grid{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .solo-card{
    --accent:var(--red);
    width:100%;
    max-width:560px;
    background:var(--bg-alt);
    background:linear-gradient(165deg, color-mix(in srgb, var(--accent) 20%, var(--bg-alt)) 0%, var(--bg-alt) 58%);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:12px;
    padding:15px 13px 13px;
    position:relative;
    transition:.15s;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .solo-card:hover{border-color:var(--accent);box-shadow:0 6px 20px -3px color-mix(in srgb, var(--accent) 60%, transparent);}
  .solo-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:11px;}
  .solo-card-title{
    display:flex;align-items:center;gap:8px;
    font-family:'Cinzel',serif;font-weight:800;font-size:14.5px;color:var(--white);
  }
  .solo-card-title span:first-child{font-size:19px;}
  .solo-tag{
    flex-shrink:0;
    background:var(--accent);color:#050505;
    font-weight:800;font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    font-family:'Rajdhani',sans-serif;
    white-space:nowrap;
  }
  .solo-desc{
    font-size:12.5px;color:var(--grey);line-height:1.5;
    margin:2px 0 14px;
    position:relative;z-index:1;
  }
  .solo-stats{display:flex;flex-direction:column;gap:7px;position:relative;z-index:1;}
  .solo-stat-row{display:flex;align-items:center;gap:9px;}
  .solo-stat-label{
    width:96px;flex-shrink:0;
    font-size:11px;font-weight:700;color:var(--grey);
    text-transform:uppercase;letter-spacing:.3px;
  }
  .solo-stat-track{
    flex:1;height:9px;border-radius:5px;overflow:hidden;
    background:color-mix(in srgb, var(--accent) 12%, var(--bg-alt));
    border:1px solid var(--border);
  }
  .solo-stat-fill{display:block;height:100%;border-radius:5px;transition:.25s;}
  .solo-stat-value{
    width:32px;flex-shrink:0;text-align:right;

   facción, igual que se organiza el equipo en el juego. El material/facción
   se deduce del propio uniquename, así que no hace falta mantener un mapeo
   aparte a mano. */
function materialFromSuffix(suffix) {
  if (!suffix) return 'leather';
  if (suffix.includes('PLATE')) return 'plate';
  if (suffix.includes('CLOTH')) return 'cloth';
  return 'leather';
}
const MATERIAL_LABEL = { plate: 'Placa', leather: 'Cuero', cloth: 'Tela' };
function groupArmorDict(dict) {
  const buckets = { plate: {}, leather: {}, cloth: {} };
  Object.keys(dict).forEach(key => {
    buckets[materialFromSuffix(dict[key][1])][key] = dict[key];
  });
  return ['plate', 'leather', 'cloth']
    .filter(m => Object.keys(buckets[m]).length)
    .map(m => ({ label: MATERIAL_LABEL[m], entries: buckets[m] }));
}
const HELM_GROUPED = groupArmorDict(HELM);
const CHEST_GROUPED = groupArmorDict(CHEST);
const BOOTS_GROUPED = groupArmorDict(BOOTS);

/* El off-hand en Albion se separa oficialmente en 3 categorías de arma
   (Escudo / Cuerno / Tomo), NO por facción de origen (Avalon, Morgana,
   etc. — eso es solo el "color"/procedencia de cada ítem dentro de su
   categoría real). Cada ítem se asigna a mano por su unique name porque,
   a diferencia de las armas principales, los sufijos de off-hand no
   comparten una raíz de texto común por categoría (p. ej. "Cuerno" incluye
   OFF_TORCH, OFF_HORN_KEEPER, OFF_LAMP_UNDEAD, etc. — nombres sin nada en
   común salvo pertenecer al mismo árbol de ítem en el juego). */
const OFF_CATEGORY = {
  OFF_SHIELD: 'shield', OFF_SHIELD_AVALON: 'shield', OFF_SPIKEDSHIELD_MORGANA: 'shield',
  OFF_SHIELD_HELL: 'shield', OFF_TOWERSHIELD_UNDEAD: 'shield', OFF_SHIELD_CRYSTAL: 'shield',
  OFF_TORCH: 'horn', OFF_HORN_KEEPER: 'horn', OFF_JESTERCANE_HELL: 'horn',
  OFF_LAMP_UNDEAD: 'horn', OFF_TALISMAN_AVALON: 'horn', OFF_TORCH_CRYSTAL: 'horn',
  OFF_BOOK: 'tome', OFF_ORB_MORGANA: 'tome', OFF_DEMONSKULL_HELL: 'tome',
  OFF_TOTEM_KEEPER: 'tome', OFF_CENSER_AVALON: 'tome', OFF_TOME_CRYSTAL: 'tome',
};
const OFF_CATEGORY_LABEL = { shield: 'Escudos', horn: 'Cuernos / Antorchas', tome: 'Tomos / Reliquias' };
function groupOffDict(dict) {
  const order = ['shield', 'horn', 'tome'];
  const buckets = {};
  order.forEach(o => { buckets[o] = {}; });
  Object.keys(dict).forEach(key => {
    const cat = OFF_CATEGORY[dict[key][1]] || 'tome';
    buckets[cat][key] = dict[key];
  });
  return order.filter(o => Object.keys(buckets[o]).length).map(o => ({ label: OFF_CATEGORY_LABEL[o], entries: buckets[o] }));
}
const OFF_GROUPED = groupOffDict(OFF);

/* ---------------- Estadísticas estimadas por equipamiento ----------------
   Para las builds en Solitario el gráfico no es un dato fijo: se recalcula
   según el arma y las piezas que el jugador tenga puestas en ese momento.
   Es una estimación propia (no datos oficiales) en base a: el arquetipo de
   la familia de arma (daño/control/sustain de su kit), el peso de la
   armadura del pecho (Placa = más tanque y menos movilidad, Tela = más
   frágil pero más utilidad) y el off-hand equipado. */
const ARMOR_MOD = {
  plate: { dano: 0, supervivencia: 2, movilidad: -2, sustain: 0, utilidad: 0 },
  leather: { dano: 0, supervivencia: 0, movilidad: 1, sustain: 0, utilidad: 0 },
  cloth: { dano: 1, supervivencia: -2, movilidad: 0, sustain: 0, utilidad: 1 },
};
const OFF_MOD = {
  OFF_SHIELD: { supervivencia: 2 },
  OFF_TORCH: { movilidad: 1 },
  OFF_SHIELD_AVALON: { supervivencia: 3 },
  OFF_TALISMAN_AVALON: { sustain: 2 },
  OFF_CENSER_AVALON: { sustain: 1, utilidad: 1 },
  OFF_ORB_MORGANA: { sustain: 2 },
  OFF_SPIKEDSHIELD_MORGANA: { utilidad: 2 },

  OFF_TOTEM_KEEPER: { sustain: 2, utilidad: 1 },
  OFF_DEMONSKULL_HELL: { dano: 1, utilidad: 2 },
  OFF_JESTERCANE_HELL: { utilidad: 2 },
  OFF_SHIELD_HELL: { supervivencia: 2 },
  OFF_TOWERSHIELD_UNDEAD: { supervivencia: 3 },
  OFF_LAMP_UNDEAD: { utilidad: 1, sustain: 1 },
  OFF_BOOK: { sustain: 2 },
  OFF_SHIELD_CRYSTAL: { supervivencia: 2 },
  OFF_TOME_CRYSTAL: { sustain: 2 },
  OFF_TORCH_CRYSTAL: { movilidad: 1 },
};

/* ---------------- Catálogo de comida (consumibles) ----------------
   De los 9 tipos de plato que existen en Albion, solo Guiso (Stew) y
   Sándwich llegan a T8 — el resto tiene un tier máximo más bajo (según la
   propia data del juego), así que no se incluyen acá para no romper el
   esquema de íconos T8 fijo de la herramienta. Cada plato (y su variante de
   pescado/avalonense) aporta un pequeño bonus a las estadísticas, igual que
   una pieza de off-hand. */
const FOOD = {
  STEW: ['Estofado de Res (Beef Stew)', 'MEAL_STEW'],
  STEW_FISH: ['Estofado de Anguila (Deadwater Eel Stew)', 'MEAL_STEW_FISH'],
  STEW_AVALON: ['Estofado Avalonense (Avalonian Beef Stew)', 'MEAL_STEW_AVALON'],
  SANDWICH: ['Sándwich de Res (Beef Sandwich)', 'MEAL_SANDWICH'],
  SANDWICH_FISH: ['Sándwich Torrente (Thunderfall Lurcher Sandwich)', 'MEAL_SANDWICH_FISH'],
  SANDWICH_AVALON: ['Sándwich Avalonense (Avalonian Beef Sandwich)', 'MEAL_SANDWICH_AVALON'],
};
const FOOD_MOD = {
  MEAL_STEW: { dano: 1 },
  MEAL_STEW_FISH: { dano: 1, utilidad: 1 },
  MEAL_STEW_AVALON: { dano: 1, sustain: 1 },
  MEAL_SANDWICH: { supervivencia: 1 },
  MEAL_SANDWICH_FISH: { supervivencia: 1, sustain: 1 },
  MEAL_SANDWICH_AVALON: { supervivencia: 1, utilidad: 1 },
};

function clamp10(n) { return Math.max(0, Math.min(10, Math.round(n))); }
function computeSoloStats(weapon, slot) {
  const fam = weaponFamilyOf(weapon.u);
  const base = fam.stats;
  const chestPiece = effectivePiece(slot, weapon, 'chest');
  const armorMod = ARMOR_MOD[materialFromSuffix(chestPiece ? chestPiece[1] : null)];
  const offPiece = effectivePiece(slot, weapon, 'off');
  const offMod = (offPiece && OFF_MOD[offPiece[1]]) || {};
  const foodPiece = effectivePiece(slot, weapon, 'food');
  const foodMod = (foodPiece && FOOD_MOD[foodPiece[1]]) || {};
  const out = {};
  Object.keys(SOLO_STATS_LABELS).forEach(k => {
    out[k] = clamp10((base[k] || 0) + (armorMod[k] || 0) + (offMod[k] || 0) + (foodMod[k] || 0));
  });
  return out;
}

/* Helper para armar una build completa: arma + set de armadura + capa (+ offhand y comida opcionales) */
function build(name, weaponU, helmKey, chestKey, bootsKey, capeKey, off, foodKey) {
  return {
    name,
    u: weaponU,
    helm: helmKey ? HELM[helmKey] : null,
    chest: chestKey ? CHEST[chestKey] : null,
    boots: bootsKey ? BOOTS[bootsKey] : null,
    cape: capeKey ? CAPE[capeKey] : null,
    off: off || null, // [nombre, uniquename]
    food: foodKey ? FOOD[foodKey] : null,
  };
}

/* Catálogo completo de armas de la herramienta: junta las de los 7 roles de
   Composición + las extra de arriba, sin duplicados. Es lo que se muestra
   al editar el arma de cualquier jugador — tanto en Solitario como en
   cualquier build de Composición/Avalón — ya que ahí no hay restricción
   por rol, se ofrecen todas, agrupadas por familia.
   El identificador de cada arma para deduplicar/buscar es SIEMPRE
   `w.name` (nunca `w.u`): varias entradas comparten el mismo ítem interno
   de Albion (`u`) pero representan variantes de build con nombre propio y
   armadura por defecto distinta — por ejemplo "Báculo de Fuego" y "Báculo
   de Fuego (Flamígero) (Azul/Dorado)" son, para el juego, el mismo ítem
   (MAIN_FIRESTAFF), pero acá son dos opciones separadas a propósito. Si se
   dedupicara por `u` se perdería una de las dos (eso es lo que pasaba con
   el Flamígero antes de este arreglo) y además, al haber dos armas con la
   misma `u`, buscar "la elegida" por `u` sería ambiguo — por eso todo el
   resto del código (el selector de arma, el ícono del muñeco, Solitario)
   también busca y compara por `name`, no por `u`. */
function buildMasterWeaponCatalog() {
  const seen = new Set();
  const list = [];
  ROLE_KEYS.forEach(rk => {
    ROLES[rk].weapons.forEach(w => {
      if (seen.has(w.name)) return;
      seen.add(w.name);
      list.push(w);
    });
  });
  SOLO_EXTRA_WEAPONS.forEach(w => {
    if (seen.has(w.name)) return;
    seen.add(w.name);
    list.push(w);
  });
  return list;
}
const MASTER_WEAPONS = buildMasterWeaponCatalog();

function weaponPickerGroups() {
  const byLabel = {};
  MASTER_WEAPONS.forEach(w => {
    const fam = weaponFamilyOf(w.u);
    if (!byLabel[fam.label]) byLabel[fam.label] = {};
    byLabel[fam.label][w.name] = [w.name, w.u];
  });
  const orderedLabels = [...WEAPON_FAMILIES.map(f => f.label), WEAPON_FAMILY_MOUNT.label, WEAPON_FAMILY_OTHER.label];
  const seenLabels = new Set();
  const groups = [];
  orderedLabels.forEach(label => {
    if (seenLabels.has(label)) return;
    seenLabels.add(label);
    if (byLabel[label]) groups.push({ label, entries: byLabel[label] });
  });
  return groups;
}
const WEAPON_PICKER_GROUPS = weaponPickerGroups();

/* Devuelve el índice del arma dentro de un rol dado su nombre exacto (para plantillas) */
function widx(role, name) {
  const i = ROLES[role].weapons.findIndex(w => w.name === name);
  return i >= 0 ? i : 0;
}

/* ---------------- Plantillas por modalidad ----------------
   Cada plantilla define, en orden, el rol (y opcionalmente el arma exacta)
   de cada slot sugerido. El usuario puede agregar/quitar/cambiar libremente.
------------------------------------------------------------- */
function tpl(role, name, count) {
  const arr = [];
  for (let i = 0; i < count; i++) arr.push({ role, weaponIdx: name ? widx(role, name) : 0 });
  return arr;
}
function flat(...groups) { return [].concat(...groups); }

/* ---------------- Build en solitario (PvE / PvP) ----------------
   Una sola tarjeta por pestaña, pensada como punto de partida totalmente
   editable: arma, casco, capa, pecho, off-hand y botas se pueden cambiar
   tocándolos, eligiendo entre TODAS las armas/piezas de la herramienta
   (agrupadas por familia/material), no solo las de la build sugerida. El
   gráfico de estadísticas se recalcula en vivo según lo que quede puesto —
   no es un valor fijo por build. */
const SOLO_STATS_LABELS = {
  dano: 'Daño',
  supervivencia: 'Supervivencia',
  movilidad: 'Movilidad',
  sustain: 'Sustain',
  utilidad: 'Utilidad',
};
const SOLO_ACCENT = { solo_pve: '#2e9e5b', solo_pvp: '#c81e3a' };

function soloBuild(id, label, icon, weaponBuild, desc) {
  return { id, label, icon, weapon: weaponBuild, desc };
}

  ],

      'Punto de partida para ganqueo/duelos en solitario — dash largo y ejecución contra objetivos con poca vida. Tocá el arma o cualquier pieza para armar tu propia build: el gráfico de abajo se recalcula según lo que elijas.'),

};

let uidCounter = 1;
function uid() { return 'slot_' + (uidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

function buildSlotsFromTemplate(entries) {
  return entries.map(e => ({ id: uid(), role: e.role, weaponIdx: e.weaponIdx || 0, player: '', gear: {} }));
}

/* Pieza efectiva a mostrar/usar para un slot: si el jugador editó esa pieza
   a mano (slot.gear[type]) se usa esa; si no, se usa la de la build por
   defecto. 'NONE' es un override explícito para "sin off-hand". */
function effectivePiece(slot, weapon, type) {
  const override = slot.gear && slot.gear[type];
  if (override === 'NONE') return null;
  if (override) {
    const dict = type === 'helm' ? HELM : type === 'chest' ? CHEST : type === 'boots' ? BOOTS : type === 'cape' ? CAPE : type === 'food' ? FOOD : OFF;
    return dict[override] || weapon[type];
  }
  return weapon[type];
}

/* ---------------- Builds guardadas por modalidad de composición ----------------
   Cada modalidad de composición (zvz/grupal/estatica/avalon_azul/avalon_dorado)
   guarda una LISTA de builds con nombre propio (no una sola) — así cualquiera
   puede armar "Build de Diego", editarla, y crear otra "Build de Barto" sin
   perder la primera. `active` indica cuál de la lista se está mostrando. Para
   ZVZ las builds de la lista se usan a la vez (son los distintos grupos de un
   mismo evento); para el resto son variantes alternativas, no simultáneas. */
const COMPOSABLE_MODES = ['zvz', 'grupal', 'estatica', 'avalon_azul', 'avalon_dorado'];
function defaultTemplateFor(mode) {
  if (mode === 'zvz') return TEMPLATES.zvz[state.zvzVariant];
  return TEMPLATES[mode];
}
function defaultCompName(mode) {
  const label = mode === 'zvz' ? 'Grupo' : (MODES[mode] ? MODES[mode].label : 'Build');
  const list = state.comps[mode].list;
  let n = list.length + 1;
  let name = `${label} ${n}`;
  while (list.some(e => e.name === name)) { n++; name = `${label} ${n}`; }
  return name;
}
function newCompEntry(mode, name) {
  return { id: uid(), name: name || defaultCompName(mode), roster: buildSlotsFromTemplate(defaultTemplateFor(mode)) };
}

/* ---------------- Balance de jugadores ---------------- */
let balUidCounter = 1;
function balUid() { return 'bal_' + (balUidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

function fmtMoney(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(Math.round(n)).toLocaleString('es-ES');
}

function findBalancePlayer(id) {
  return state.balances.find(p => p.id === id);
}

function addBalancePlayer(name) {
  const clean = (name || '').trim();
  if (!clean) return null;
  const existing = state.balances.find(p => p.name.toLowerCase() === clean.toLowerCase());
  if (existing) return existing;
  const p = { id: balUid(), name: clean, balance: 0, history: [] };
  state.balances.push(p);
  return p;
}

function addBalanceMovement(playerId, delta, note) {
  const p = findBalancePlayer(playerId);
  if (!p || !delta) return;
  p.balance += delta;
  p.history.unshift({ id: balUid(), delta, note: (note || '').trim(), ts: Date.now() });
}

function removeBalancePlayer(playerId) {
  state.balances = state.balances.filter(p => p.id !== playerId);
}

function currentCompBucket() {
  return state.comps[state.mode];
}
function currentCompEntry() {
  const bucket = currentCompBucket();
  return bucket ? bucket.list[bucket.active] : null;
}
function currentRoster() {
  const entry = currentCompEntry();
  return entry ? entry.roster : [];
}
function setCurrentRoster(newRoster) {
  const entry = currentCompEntry();
  if (entry) entry.roster = newRoster;
}

/* ---------------- Render: barra de modos ---------------- */
/* Cuatro secciones de primer nivel — "Composición" (agrupa ZVZ/Grupales/
   Estática), "Solitario" (agrupa builds PvE/PvP para un solo jugador),
   "Avalón" (agrupa las comps Azul/Dorado de los Caminos Avalonianos) y
   "Balance" — en un único menú. Composición, Solitario y Avalón tienen un
   segundo selector más chico para elegir la modalidad específica. */
const COMP_MODES = ['zvz', 'grupal', 'estatica'];
const AVALON_MODES = ['avalon_azul', 'avalon_dorado'];
const SECTIONS = {
  comp: { label: 'Composición', icon: '📋', subModes: COMP_MODES, lastKey: 'lastCompMode', fallback: 'zvz' },
  solo: { label: 'Solitario', icon: '🗡️', subModes: SOLO_MODES, lastKey: 'lastSoloMode', fallback: 'solo_pve' },
  avalon: { label: 'Avalón', icon: '🔷', subModes: AVALON_MODES, lastKey: 'lastAvalonMode', fallback: 'avalon_azul' },
  balance: { label: 'Balance', icon: '💰' },
};
function currentSection() {
  if (state.mode === 'balance') return 'balance';
  if (SOLO_MODES.includes(state.mode)) return 'solo';
  if (AVALON_MODES.includes(state.mode)) return 'avalon';
  return 'comp';
}

function renderModeBar() {
  const bar = document.getElementById('modeBar');
  bar.innerHTML = '';

  const menu = document.createElement('div');
  menu.className = 'mode-menu';
  for (const key of Object.keys(SECTIONS)) {
    const s = SECTIONS[key];
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'mode-item' + (currentSection() === key ? ' active' : '');
    item.innerHTML = `<span>${s.icon}</span><span>${s.label}</span>`;
    item.onclick = () => {
      if (currentSection() === key) return;
      if (key === 'balance') {
        state.mode = 'balance';
      } else {
        state.mode = state[s.lastKey] || s.fallback;
      }
      renderAll();
    };
    menu.appendChild(item);
  }
  bar.appendChild(menu);

  const activeSection = SECTIONS[currentSection()];
  if (activeSection && activeSection.subModes) {
    const sub = document.createElement('div');
    sub.className = 'submode-menu';
    activeSection.subModes.forEach(key => {
      const m = MODES[key];
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'submode-item' + (state.mode === key ? ' active' : '');
      item.innerHTML = `<span>${m.icon}</span><span>${m.label}</span>`;
      item.onclick = () => { state.mode = key; state[activeSection.lastKey] = key; renderAll(); };
      sub.appendChild(item);
    });
    bar.appendChild(sub);
  }

  const desc = document.createElement('div');
  desc.className = 'mode-desc';
  desc.textContent = MODES[state.mode].desc;
  bar.appendChild(desc);
}

function buildZvzVariantBar() {
  const wrap = document.createElement('div');
  wrap.className = 'group-bar';
  const label = document.createElement('div');
  label.style.cssText = 'font-size:12px;color:var(--grey);align-self:center;margin-right:4px;';
  label.textContent = 'Doctrina:';
  wrap.appendChild(label);
  for (const key of Object.keys(ZVZ_VARIANTS)) {

    tab.className = 'group-tab' + (state.zvzVariant === key ? ' active' : '');
    tab.title = v.desc;
    tab.innerHTML = `${v.icon} ${v.label}`;

      if (state.zvzVariant === key) return;
      const ok = confirm(`¿Aplicar la doctrina "${v.label}" a TODOS los grupos ZVZ guardados? Se perderán los nombres de jugador asignados (los nombres de las builds se mantienen).`);

      state.zvzVariant = key;
      state.comps.zvz.list.forEach(entry => { entry.roster = buildSlotsFromTemplate(TEMPLATES.zvz[key]); });
      renderPanel();
